# 统一游戏测试平台 · CI 第一阶段（L0 平台测试 + L1 平台真实启动冒烟）
#
# 为什么是 self-hosted（而不是 ubuntu-22.04）：
#   平台把"测试资产 → 执行 → 报告"封在本机，依赖 Windows 上的 Python/Anaconda
#   与受控本地路径。托管 runner 看不到这些，跑不了 L1。
#
# 为什么先只开 workflow_dispatch：
#   等它在当前 Windows self-hosted runner 上稳定通过后，再单独评估是否加
#   push / pull_request。不要一上来就挂 PR 关卡，否则天天红。
#
# 为什么 shell 是 'powershell -NoProfile -ExecutionPolicy Bypass -File "{0}"'：
#   runner 内置的 powershell shell 等价于 `powershell -command ". '{0}'"`，**不带 -ExecutionPolicy**。
#   self-hosted runner 服务账户（NT AUTHORITY\NETWORK SERVICE）的有效执行策略是 Restricted
#   （它的 CurrentUser 未设、LocalMachine 未设 → 客户端 SKU 默认 Restricted），
#   于是临时 .ps1 被拒：PSSecurityException / UnauthorizedAccess / running scripts is disabled。
#   本机 MachinePolicy / UserPolicy 均为 Undefined（**无组策略强制**），所以命令行上的
#   -ExecutionPolicy Bypass（Process 作用域，优先级高于 CurrentUser / LocalMachine）即可生效，
#   且**只作用于该 PowerShell 进程** —— 不修改机器/用户的 ExecutionPolicy。
#   ⚠️ 首个 token 必须是**裸 `powershell`**：runner 用 shell 字符串第一个空格前的部分去查扩展名
#      映射表（powershell→.ps1，大小写不敏感；见 ScriptHandlerHelpers）。写成 `powershell.exe`
#      会查不到 → 临时脚本没有扩展名 → `-File` 会以「不具有 '.ps1' 扩展名」失败。
#   代价：步骤日志里的中文可能显示为乱码，**不影响判定**（判定只看退出码与真实库哈希）。

name: Unified Test Platform CI (L0 + L1)

on:
  workflow_dispatch:

# 平台为 SQLite + 进程内 scheduler + executor_locks 表，存在**全局串行**约束：
# 同一平台同时只允许一个实例执行。这里用 workflow 级 concurrency 串行化，
# 而不是引入 Worker / 队列（本轮明确不做）。
# group 与仓库名一致（concurrency group 本身按仓库隔离，这里只是保持可读性）。
concurrency:
  group: unified-test-platform-ci
  cancel-in-progress: false

permissions:
  contents: read

env:
  # 运行 L0/L1 的解释器：优先仓库变量 PLATFORM_CI_PYTHON，未设置则用 PATH 上的 python。
  # 刻意在 workflow 层覆盖，而不是依赖 config_center 里的本机默认值 ——
  # 这样 CI 完全不依赖任何 F:\ 绝对路径。
  PYTHON_EXE: ${{ vars.PLATFORM_CI_PYTHON || 'python' }}
  # 本机存在 http_proxy，会让 urllib 把 127.0.0.1 也送去代理（502）→ 必须排除。
  # ⚠️ 这里只能写一个 NO_PROXY：GitHub 对环境变量名**大小写不敏感**，
  #    再补一行 `no_proxy` 会直接判为 "Invalid workflow file: 'no_proxy' is already defined"
  #    （整份 workflow 失效、run 里没有任何 job）。Windows runner 上环境变量本就
  #    大小写不敏感，Python 的 urllib 也能正常读到 NO_PROXY，无需再写小写形式。
  NO_PROXY: 127.0.0.1,localhost
  PYTHONUNBUFFERED: "1"

jobs:
  # ============================================================
  # L0：平台代码级测试（约 94 条，进程内 TestClient，零外部依赖）
  # ============================================================
  l0-unit:
    name: L0 / 平台代码级测试
    runs-on: [self-hosted, Windows]
    timeout-minutes: 20
    steps:
      - name: 签出仓库
        uses: actions/checkout@v4

      - name: Runner 环境自检
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File "{0}"'
        run: |
          Write-Host "runner.os        = $env:RUNNER_OS"
          Write-Host "runner.arch      = $env:RUNNER_ARCH"
          Write-Host "workspace        = $env:GITHUB_WORKSPACE"
          Write-Host "python           = $env:PYTHON_EXE"
          & $env:PYTHON_EXE --version
          # L0 只依赖这些包，缺任何一个都应立刻失败（而不是悄悄跳过用例）
          & $env:PYTHON_EXE -c "import fastapi, uvicorn, pydantic, pytest, httpx; print('L0 deps OK')"

      - name: 记录真实库指纹（L0 前）
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $db = "data\db.sqlite"
          $out = Join-Path $env:RUNNER_TEMP "db_before.txt"
          if (Test-Path $db) { (Get-FileHash $db -Algorithm MD5).Hash } else { "ABSENT" } |
            Out-File -FilePath $out -Encoding utf8
          Write-Host "L0 前真实库指纹: $(Get-Content $out)"
          Write-Host "说明：L0 全部使用隔离临时库；真实库指纹在 L0 后必须一致"

      - name: L0 - 运行平台测试套件
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File "{0}"'
        run: |
          & $env:PYTHON_EXE -m pytest backend/tests -q -o addopts=
          if ($LASTEXITCODE -ne 0) { throw "L0 失败：pytest 退出码 $LASTEXITCODE" }

      - name: 校验 L0 未写真实库
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $db = "data\db.sqlite"
          $before = Get-Content (Join-Path $env:RUNNER_TEMP "db_before.txt")
          $after = if (Test-Path $db) { (Get-FileHash $db -Algorithm MD5).Hash } else { "ABSENT" }
          Write-Host "L0 后真实库指纹: $after"
          if ($before -ne $after) { throw "L0 改动了真实运行库！before=$before after=$after" }

  # ============================================================
  # L1：平台真实启动 + Demo Plan 执行 → Report
  # ============================================================
  l1-platform-smoke:
    name: L1 / 平台真实启动 + Demo Plan
    needs: l0-unit
    runs-on: [self-hosted, Windows]
    timeout-minutes: 20
    steps:
      - name: 签出仓库
        uses: actions/checkout@v4

      - name: 记录真实库指纹（L1 前）
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $db = "data\db.sqlite"
          if (Test-Path $db) { (Get-FileHash $db -Algorithm MD5).Hash } else { "ABSENT" } |
            Out-File -FilePath (Join-Path $env:RUNNER_TEMP "db_before_l1.txt") -Encoding utf8
          Write-Host "L1 前真实库指纹: $(Get-Content (Join-Path $env:RUNNER_TEMP 'db_before_l1.txt'))"

      - name: L1 - 隔离实例端到端冒烟
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File "{0}"'
        # 该脚本自带完整隔离与自证：动态空闲端口 / 临时数据目录 / 自记 PID，
        # 并断言 真实库 md5+mtime+文件数不变、无残留进程、端口已释放。
        run: |
          & $env:PYTHON_EXE _ci/l1_smoke.py
          if ($LASTEXITCODE -ne 0) { throw "L1 失败：l1_smoke.py 退出码 $LASTEXITCODE" }

      - name: 校验 L1 未写真实库
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $db = "data\db.sqlite"
          $before = Get-Content (Join-Path $env:RUNNER_TEMP "db_before_l1.txt")
          $after = if (Test-Path $db) { (Get-FileHash $db -Algorithm MD5).Hash } else { "ABSENT" }
          Write-Host "L1 后真实库指纹: $after"
          if ($before -ne $after) { throw "L1 改动了真实运行库！before=$before after=$after" }

      - name: 残留进程检查
        if: always()
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File "{0}"'
        # 只匹配"由 CI 启动"的平台进程：它们必然带 --data-dir（L1 脚本总是显式传）。
        # 这样不会误伤开发机自己起的 `python backend/run.py --no-browser`。
        run: |
          $left = Get-CimInstance Win32_Process -Filter "Name='python.exe'" |
                  Where-Object { $_.CommandLine -like '*run.py*' -and $_.CommandLine -like '*--data-dir*' }
          if ($left) {
            $left | Select-Object ProcessId, CommandLine | Format-List
            throw "存在残留的 CI 平台进程，必须清理"
          }
          Write-Host "无残留 CI 平台进程"

      - name: 上传 CI 日志与产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l1-smoke-logs
          path: _ci_out/
          if-no-files-found: warn
          retention-days: 14
