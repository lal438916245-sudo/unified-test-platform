<head data-page-node-id="JWt43M51okWjz89kieI7Pq">

<title>统一游戏测试平台 MVP</title>
<style>
  :root{
    --brand:#12B886; --brand-d:#0b8c61; --bg:#ffffff; --bg2:#f6faf8; --rule:#d7e1dd;
    --ink:#1b201e; --muted:#586561; --ok:#36b37e; --fail:#e5484d; --run:#2471e8;
    --warn:#f0a500;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{margin:0;font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;color:var(--ink);background:#fbfcfb;font-size:14px}
  header{background:#fff;border-bottom:1px solid var(--rule);padding:14px 28px;display:flex;align-items:center;gap:20px;position:sticky;top:0;z-index:5}
  header .logo{font-weight:700;font-size:15px;color:var(--brand-d)}
  header a{color:var(--muted);text-decoration:none;font-size:13px}
  header a.on{color:var(--brand-d);font-weight:600}
  main{max-width:1080px;margin:20px auto;padding:0 24px}
  h1{font-size:18px;margin:4px 0 16px}
  .card{background:#fff;border:1px solid var(--rule);border-radius:10px;padding:18px;margin-bottom:18px}
  .card h2{font-size:15px;margin:0 0 12px;color:var(--ink)}
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--rule);vertical-align:top}
  th{color:var(--muted);font-weight:600;font-size:12px;background:var(--bg2)}
  .pr-entry-scroll{max-width:100%;overflow-x:auto}
  .pr-entry-table{table-layout:fixed;min-width:880px}
  .pr-entry-table th,.pr-entry-table td{overflow-wrap:anywhere}
  .pr-entry-table code{white-space:normal;overflow-wrap:anywhere}
  .pr-entry-table th:nth-child(4),.pr-entry-table td:nth-child(4){white-space:nowrap}
  .pr-entry-actions{display:flex;flex-wrap:wrap;gap:6px}
  .pr-entry-actions button{white-space:nowrap;flex:0 0 auto}
  button{cursor:pointer;border:1px solid var(--rule);background:#fff;border-radius:6px;padding:5px 12px;font-size:13px}
  button.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  button:hover{filter:brightness(.97)}
  .chip{display:inline-block;padding:1px 9px;border-radius:999px;font-size:12px;font-weight:600}
  .c-queued{background:#eef1f0;color:#5b6b66}.c-running{background:#e7f0fd;color:var(--run)}
  .c-success{background:#e4f6ee;color:var(--ok)}.c-failed{background:#fcebec;color:var(--fail)}
  .c-cancelling{background:#fdf3e3;color:#d9822b}
  .c-cancelled,.c-timedout{background:#f4f2ea;color:#8a6d00}
  .c-skipped{background:#eef1f0;color:#8a9791}
  .c-partial{background:#e7f0fd;color:var(--run)}
  .filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .filters select,.filters input{border:1px solid var(--rule);border-radius:6px;padding:5px 8px;font-size:13px;background:#fff}
  .pager{display:flex;gap:8px;align-items:center;margin-top:10px}
  .diff{font-weight:700}
  .diff.up{color:var(--ok)}.diff.down{color:var(--fail)}.diff.flat{color:var(--muted)}
  .sel-base{background:#e7f0fd;border:1.5px solid var(--run)}
  .sel-cand{background:#e4f6ee;border:1.5px solid var(--ok)}
  pre.log{background:#10151f;color:#cdd7e2;padding:14px;border-radius:8px;overflow:auto;max-height:320px;font-size:12px;font-family:Consolas,monospace;display:none}
  pre.raw{background:var(--bg2);border:1px solid var(--rule);color:var(--ink);padding:14px;border-radius:8px;overflow:auto;max-height:420px;font-size:12px;font-family:Consolas,monospace}
  .metrics{display:flex;gap:24px;flex-wrap:wrap;margin:6px 0}
  .metrics .k{font-size:12px;color:var(--muted)}.metrics .v{font-size:20px;font-weight:700}
  .muted{color:var(--muted);font-size:12px}
  /* 预检三态（.ok/.bad 只作用于 .pre 内部，而"配置就绪度"表格在 .pre 之外，故另立可全局使用的类） */
  .st-ok{color:var(--ok);font-weight:700}
  .st-bad{color:var(--fail);font-weight:700}
  .st-warn{color:var(--warn);font-weight:700}
  .st-na{color:var(--muted)}
  .hint-warn{border-left:3px solid var(--warn);background:#fff8e6;padding:8px 12px;border-radius:6px;margin:8px 0 0;font-size:12px}
  .hint-warn ul{margin:4px 0 0 18px;padding:0}
  a{color:var(--brand-d)}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .err{border-left:3px solid var(--fail);background:#fdf0f0;padding:10px 12px;border-radius:6px}
  .form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
  .form-grid label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
  .form-grid label.inline{flex-direction:row;align-items:center;gap:6px}
  .form-grid input,.form-grid select{border:1px solid var(--rule);border-radius:6px;padding:6px 8px;font-size:13px;background:#fff;color:var(--ink)}
  .mg-export-scroll{max-width:100%;overflow-x:auto}
  .mg-export-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));min-width:768px;gap:24px;align-items:start}
  .mg-export-group{min-width:0}
  .mg-export-group h3{margin:0 0 12px;font-size:14px;line-height:20px;white-space:nowrap}
  .mg-export-items{display:flex;flex-direction:column;gap:8px}
  .mg-export-items label{display:flex;align-items:flex-start;gap:8px;line-height:20px}
  .mg-export-items input{flex:0 0 auto;width:16px;height:16px;margin:2px 0 0;padding:0}
  .mg-export-items span{min-width:0;overflow-wrap:anywhere}
  .mg-export-empty{margin:0;line-height:20px}
  .pre{background:var(--bg2);border:1px solid var(--rule);border-radius:8px;padding:12px}
  .pre .ok{color:var(--ok);font-weight:700}
  .pre .bad{color:var(--fail);font-weight:700}
  .pre ul{margin:6px 0 0 18px;padding:0}
  .pre li{font-size:12px;margin:2px 0}
</style>

<body data-page-node-id="v7LGSwjBXPg3XyLhtNFEFL">
<header data-page-node-id="af2lsdAofOFljljeGq5Mbz">
  <span class="logo" data-page-node-id="EW9JVFwMD164ROghz6IQ7J">统一游戏测试平台 MVP</span>

    <a href="#/plans" data-page-node-id="mjqQC4XO4MFi6naEEUw7m6">测试计划</a>
    <a href="#/cases" data-page-node-id="D0QhgK9rs1UioysP29oMSL">测试用例</a>

    <a href="#/migration">安装与配置迁移</a>
  </nav>
  <span class="muted" style="margin-left:auto" id="health" data-page-node-id="EEP2FUhAd8yU7jTHy1Bmgv"></span>

<script>
const API='';
const $=id=>document.getElementById(id);
const jInFlight=new Map();
async function j(path,opt){
  if(opt)opt={...opt,headers:{"X-Platform-Config":"1",...(opt.headers||{})}};
  const load=async()=>{const r=await fetch(API+path,opt);if(!r.ok)throw new Error(r.status+' '+await r.text());return r.json();};
  if(opt){
    // A write must not let its following GET join an older, pre-write request.
    const write=(opt.method||'GET').toUpperCase()!=='GET';
    if(write)jInFlight.clear();
    try{return await load();}finally{if(write)jInFlight.clear();}
  }
  let pending=jInFlight.get(path);
  if(!pending){
    pending=load().finally(()=>{if(jInFlight.get(path)===pending)jInFlight.delete(path);});
    jInFlight.set(path,pending);
  }
  // Callers may edit form data; sharing a request must not share mutable objects.
  return structuredClone(await pending);
}
function chip(s){return `<span class="chip c-${s}">${s}</span>`;}
function esc(s){s=String(s==null?'':s);return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function term(status){return ['success','failed','cancelled','timedout','skipped'].includes(status);}
let timer=null, pollBusy=false, routeVersion=0;
// ---------- 报告对比选择（基线/候选，存会话，跨页保持） ----------
function pickBaseline(jobId){sessionStorage.setItem('rc_base',String(jobId));alert('已设为基线报告 #'+jobId);router();}
function pickCandidate(jobId){sessionStorage.setItem('rc_cand',String(jobId));alert('已设为候选报告 #'+jobId);router();}
function pickClear(){sessionStorage.removeItem('rc_base');sessionStorage.removeItem('rc_cand');router();}
function compareSel(){
  // 只如实返回"到底选了什么"，**不要**把"只选了一个"抹成"没选"：
  // 抹掉之后界面既不给行高亮、也没有"已选基线 #X"的提示与清除入口，
  // 用户设完基线毫无反馈、也无法撤销（2026-10-13 修）。
  const b=sessionStorage.getItem('rc_base'), c=sessionStorage.getItem('rc_cand');
  return {b:b||null,c:c||null};
}

function router(){
  routeVersion++;
  clearInterval(timer); timer=null;
  const h=location.hash||'#/plans';
  if(!h.startsWith('#/env')){cfgForm=null;cfgFocusPending=false;}
  if(!h.startsWith('#/cases')){tcEdit=null;tcMsg='';}
  if(!h.startsWith('#/suites')){tsEdit=null;tsMsg='';}
  if(h.startsWith('#/run/')) renderRun(h.split('/')[2]);
  else if(h.startsWith('#/report/')) renderReport(h.split('/')[2]);
  else if(h.startsWith('#/compare/')){const parts=h.split('/').slice(2);renderCompare(parts[0],parts[1]);}
  else if(h.startsWith('#/reports-center')) renderReportCenter();
  else if(h.startsWith('#/cases')) renderCases();
  else if(h.startsWith('#/suites')) renderSuites();
  else if(h.startsWith('#/projects')) renderProjects();
  else if(h.startsWith('#/migration')) renderMigration(h.split('/')[2]);
  else if(h.startsWith('#/env')) renderEnv();
  else if(h.startsWith('#/plan-editor/')) renderPlanEditor(h.split('/')[2]);
  else renderPlans();
  navHighlight(h);
}
function navHighlight(h){
  document.querySelectorAll('nav a').forEach(a=>{
    const key=a.getAttribute('href').slice(1);
    const onReal = h.startsWith('#'+key) || (key==='plans' && (h==='#/plans'||h===''));
    a.classList.toggle('on', onReal);
  });
}
window.addEventListener('hashchange',router);
// Position newly opened forms below the sticky navigation, including cross-page links.
function focusForm(id){
  const form=$(id);if(!form)return;
  form.style.scrollMarginTop=((document.querySelector('header')?.offsetHeight||0)+16)+'px';
  form.scrollIntoView({block:'start'});
  form.querySelector('input:not([type="hidden"]):not([disabled]),select:not([disabled])')?.focus({preventScroll:true});
}
window.addEventListener('load',()=>{heartbeat();router();});
async function heartbeat(){try{const[e,x]=await Promise.all([j('/api/environments'),j('/api/executors')]);$('health').textContent=`环境 ${e.length} · 执行机 ${x.length}`}catch(e){$('health').textContent='后端未连接'}}

// ---------- 计划列表 ----------
let plListMode='active', plArchiveBusy=false, plArchiveMessage='';
async function renderPlans(){
  const view=routeVersion;
  const app=$('app'); app.innerHTML='<h1>测试计划</h1><div class="card"><p class="muted">加载中…</p></div>';
  try{
    const plans=await j('/api/plans?status='+plListMode);
    if(view!==routeVersion)return;
    const rows=plans.map(p=>`
      <tr>
        <td><strong>${esc(p.name)}</strong>${p.archived?' <span class="chip c-skipped">已归档</span>':''}<div class="muted">${esc(p.description||'')}</div>${p.archived_at?`<div class="muted">归档于 ${esc(p.archived_at)}</div>`:''}</td>
        <td class="muted">${esc((p.steps||[]).map(s=>s.engine).join(' → '))||'无'}</td>
        <td class="muted">rev ${p.revision??1}<div class="muted">${esc(p.updated_at||'-')}</div></td>
        <td class="row">
          ${p.archived?`<button class="primary" onclick="plChangeArchive(${p.id},false)">恢复</button>`:
          `<button class="primary" onclick="trigger(${p.id})">一键执行</button>
          <button onclick="plPrecheckSaved(${p.id})">预检</button>`}
          <button onclick="location.hash='#/plan-editor/${p.id}'">${p.archived?'查看':'编辑'}</button>
          <button onclick="plCopy(${p.id})">复制</button>
          ${p.archived?'':`<button onclick="plChangeArchive(${p.id},true)">归档</button>`}
        </td>
      </tr>`).join('');
    app.innerHTML=`<h1>测试计划</h1>
      <div class="card">
        <div class="row"><h2 style="margin:0">计划列表</h2>
          <button class="primary" style="margin-left:auto" onclick="location.hash='#/plan-editor/new'">新建计划</button></div>
        <div class="row" style="margin-top:12px">${[['active','使用中'],['archived','已归档'],['all','全部']].map(([key,label])=>
          `<button ${plListMode===key?'class="primary"':''} aria-pressed="${plListMode===key}" onclick="plSetListMode('${key}')">${label}</button>`).join('')}
          <span class="muted">当前 ${plans.length} 个计划</span></div>
        <p class="muted">归档后移出使用中列表，历史执行与报告保留。恢复后可继续编辑和执行；有未结束任务的计划需等待结束或取消后再归档。</p>
        <p id="pl-list-msg" role="status" aria-live="polite">${esc(plArchiveMessage)}</p>
        <table style="margin-top:10px"><thead><tr><th>名称</th><th>执行单元</th><th>版本</th><th>操作</th></tr></thead>
          <tbody>${rows||'<tr><td colspan=4 class=muted>暂无计划</td></tr>'}</tbody></table></div>
      <div id="pl-precheck-host"></div>
      <div class="card"><h2>最近执行记录</h2><div id="recent"></div></div>`;
    loadRecent();
  }catch(e){if(view===routeVersion)app.innerHTML=`<div class="card err">加载计划失败：${esc(e.message)}</div>`;}
}
function plSetListMode(mode){plListMode=mode;plArchiveMessage='';renderPlans();}
async function plChangeArchive(id,archived,editor=false){
  if(plArchiveBusy)return;
  plArchiveBusy=true;
  try{
    await j(`/api/plans/${id}/${archived?'archive':'restore'}`,{method:'POST'});
    plArchiveMessage=archived?'已归档，可在“已归档”列表恢复。':'已恢复，可在“使用中”列表继续编辑和执行。';
    if(editor)await renderPlanEditor(String(id));else await renderPlans();
  }catch(e){
    const host=$(editor?'pl-msg':'pl-list-msg');
    if(host)host.textContent='操作失败：'+e.message;
  }finally{plArchiveBusy=false;}
}
let recentLimit=8;   // 最近执行记录的显示条数（「加载更多」每次 +16）
async function loadRecent(){
  const host=$('recent');if(!host)return;
  try{
    const runs=await j(`/api/runs?limit=${recentLimit}`);
    if($('recent')!==host)return;
    const body=runs.map(r=>`<tr><td>${r.id}</td><td>${esc(r.plan_name||r.plan_id)}</td><td>${chip(r.status)}</td>
        <td class=muted>${esc(r.started_at||'-')}</td><td><a href="#/run/${r.id}">查看</a></td></tr>`).join('')||
        '<tr><td colspan=5 class=muted>暂无执行记录</td></tr>';
    host.innerHTML=`<table><thead><tr><th>#</th><th>计划</th><th>状态</th><th>开始</th><th></th></tr></thead>
      <tbody>${body}</tbody></table>
      <div class="row" style="margin-top:10px"><span class="muted">显示最近 ${runs.length} 条</span>
        ${runs.length>=recentLimit?`<button style="margin-left:auto" onclick="recentLimit+=16;loadRecent()">加载更多</button>`:''}</div>`;
  }catch(e){if($('recent')===host)host.innerHTML='<span class="muted">加载执行记录失败</span>';}
}
async function trigger(id){
  if(!confirm('确认触发该计划？'))return;
  try{const out=await j(`/api/plans/${id}/run`,{method:'POST'});location.hash='#/run/'+out.run_id;}
  catch(e){alert('触发失败：'+e.message);}
}

// ---------- 执行详情 ----------
async function renderRun(runId,silent){
  const app=$('app');
  const keepLogs=$('logsl')?$('logsl').innerHTML:'';   // 轮询重绘时保留已打开的日志面板
  if(!silent) app.innerHTML='<h1>执行详情</h1><div class="card"><p class="muted">加载中…</p></div>';
  try{
    const {run,jobs,plan_archived}=await j(`/api/runs/${runId}`);
    const snap=run.plan_snapshot||null;
    const planName=(snap&&snap.name)||('plan#'+run.plan_id);
    const rev=run.plan_revision!=null?run.plan_revision:(snap?snap.revision:null);
    const html=`<h1>执行详情 <span class="muted">#${runId}</span></h1>
      <div class="card">
        <div class="row"><span class="muted">计划</span><strong>${esc(planName)}</strong>
          <span class="muted">版本</span>${rev!=null?`<span class="chip c-queued">rev ${rev}</span>`:'<span class="muted">-</span>'}
          <span class="muted">状态</span>${chip(run.status)} <span class="muted">${esc(run.started_at||'')}</span></div>
        <p class="muted" style="margin-top:8px">计划名与版本取自执行时的不可变快照；后续编辑原计划不会改变本次执行与报告。</p>
      </div>
      ${plan_archived?'<div class="card hint-warn">原计划已归档，历史记录和产物仍可查看。恢复计划后可重试。<a href="#/plans" onclick="plListMode=\'archived\'">前往已归档计划 →</a></div>':''}
      ${planSnapshotCard(snap)}
      <div class="card"><h2>执行单元</h2><table><thead><tr><th>#</th><th>Job</th><th>引擎</th><th>状态</th><th>尝试</th><th>退出码</th><th>操作</th></tr></thead>
        <tbody>${jobs.map(jb=>`
          <tr>
            <td>${jb.id}</td>
            <td>${esc(jb.name)}${jb.retry_of?`<div class="muted">重试自 #${jb.retry_of}</div>`:''}</td>
            <td>${esc(jb.engine)}</td>
            <td>${chip(jb.status)}${jb.status==='cancelling'?'<div class="muted" style="color:var(--warn)">正在取消…</div>':''}</td>
            <td>#${jb.attempt??1}</td><td>${jb.exit_code??'-'}</td>
            <td class="row">
              <a href="javascript:void 0" onclick="showLogs(${jb.id})">日志</a>
              ${!term(jb.status)?`<button ${jb.status==='cancelling'?'disabled':''} onclick="cancel(${jb.id})">${jb.status==='cancelling'?'取消中…':'取消'}</button>`:''}
              ${term(jb.status)?`<button ${plan_archived?'disabled title="请先恢复原计划"':''} onclick="retry(${jb.id})">重试</button>`:''}
              ${jb.report_path?`<a href="#/report/${jb.id}">报告</a>`:''}
            </td>
          </tr>`).join('')}</tbody></table>
        <div id="logsl">${keepLogs}</div>
      </div>`;
    if(app.innerHTML!==html) app.innerHTML=html;   // 内容没变就不重绘：轮询刷新不再整页闪烁
    pollRun(runId,jobs);
  }catch(e){if(!silent)app.innerHTML=`<div class="card err">加载执行失败：${esc(e.message)}</div>`;}
}
async function showLogs(jobId){
  const host=$('logsl');const data=await j(`/api/jobs/${jobId}/logs`);
  host.innerHTML=`<pre class="log" style="display:block">${esc(data.logs.join(''))||'（暂无日志）'}</pre>`;
}
async function cancel(jobId){await j(`/api/jobs/${jobId}/cancel`,{method:'POST'});router();}
async function retry(jobId){const out=await j(`/api/jobs/${jobId}/retry`,{method:'POST'});alert('已创建重试 Job #'+out.new_job_id);router();}
function pollRun(runId,jobs){
  if(jobs.every(x=>term(x.status)))return;
  // 关键：已有轮询在跑就不要再新建 —— 否则每次 renderRun 都会再挂一个 setInterval，
  // 而 timer 只能记住最后一个，旧的全部变成"孤儿定时器"永不清理 → 整页被反复重绘（屏闪）。
  if(timer)return;
  timer=setInterval(async()=>{
    if(pollBusy)return;                       // 上一次请求还没回来 → 跳过本轮，避免重绘堆积
    pollBusy=true;
    try{
      const{run,jobs:js}=await j(`/api/runs/${runId}`);
      // 运行到达终态后立刻停止轮询：否则整页会被反复整体重绘，日志面板会被周期性清空
      if(term(run.status)){clearInterval(timer);timer=null;}
      renderRun(runId,true);                  // 静默刷新：不闪「加载中」，内容没变则不重绘
    }catch(e){}finally{pollBusy=false;}
  },1200);
}

function spark(series,title){
  if(!series||!series.length) return `<p class="muted">（无时序数据）</p>`;
  const W=720,H=120,pad=8;
  const maxv=Math.max(...series.map(p=>Math.max(p.rps||0,p.p95_ms||0,p.failure_rate||0)));
  const t=series.map(p=>({...p}));
  function pts(k){return t.map((p,i)=>[pad+i*(W-2*pad)/Math.max(t.length-1,1), H-pad-(p[k]||0)/Math.max(maxv,1e-9)*(H-2*pad)]).map(p=>p.join(',')).join(' ');}
  const lines=[['rps','#2471e8'],['p95_ms','#f0a500'],['failure_rate','#e5484d']];
  const polys=lines.map(([k,c])=>`<polyline points="${pts(k)}" fill="none" stroke="${c}" stroke-width="1.6"/>`).join('');
  const legend=lines.map(([k,c],i)=>`<text x="${W-140}" y="${12+i*14}" font-size="11" fill="${c}">● ${k}</text>`).join('');
  const svg = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;margin-top:8px">${polys}${legend}</svg>`;
  return `<div><h3 style="margin-top:14px">${esc(title)}</h3>${svg}<p class="muted">共 ${series.length} 个采样点</p></div>`;
}

    <table><thead><tr><th>设备</th><th>执行机</th><th>窗口匹配规则</th><th>Poco</th><th>状态</th><th>操作</th></tr></thead><tbody>${rows||'<tr><td colspan=6>暂无设备；先在 Executor 中允许 airtest，再新增设备。</td></tr>'}</tbody></table></div>`;

async function cfgProbeDevice(id,realtime=false){
  $('cfg-precheck').innerHTML='<div class="card">只读探测中…</div>';
  try{
    cfgPrecheck=await j(`${CFG_BASE.device}/${id}/${realtime?'runtime-probe':'probe'}`,{method:'POST'});
    $('cfg-precheck').innerHTML=cfgPrecheck.checks&&cfgPrecheck.checks.some(c=>c.status)
      ?`<div class="card"><h2>${esc(cfgPrecheck.entity)} · ${esc(cfgPrecheck.name)}</h2>${runtimeChecksHtml(cfgPrecheck.checks)}<p class="muted">设备探测不检查某个用例的项目依赖或 MongoDB；完整检查请进入计划预检。</p></div>`
      :cfgPrecheckHtml(cfgPrecheck);
    $('cfg-precheck').scrollIntoView({behavior:'smooth',block:'center'});
  }catch(e){alert('窗口探测失败：'+e.message);}
}
async function cfgDiscoverWindows(){
  const host=$('cfg-windows');
  const executorId=Number($('cf-device-executor').value);
  if(!Number.isInteger(executorId)||executorId<=0){
    host.textContent='请先选择关联执行机（需允许 airtest），再查看本机窗口。';
    return;
  }
  host.textContent='只读探测中…';
  try{
    const result=await j('/api/config/ui-windows/probe',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({executor_id:executorId})});
    cfgWindows=result.windows||[];
    host.innerHTML=`<table><thead><tr><th>标题</th><th>进程 / 类名</th><th></th></tr></thead><tbody>${cfgWindows.map((w,i)=>
      `<tr><td>${esc(w.title)}</td><td>${esc(w.process_name)} / ${esc(w.window_class)}</td><td><button onclick="cfgUseWindow(${i})">采用此窗口</button></td></tr>`).join('')||'<tr><td>没有可见窗口</td></tr>'}</tbody></table>`;
  }catch(e){host.textContent='探测失败：'+e.message;}
}
function cfgUseWindow(i){
  const w=cfgWindows[i]; if(!w)return;
  $('cf-title-match').value=$('cf-unity-editor').checked?w.title.split(' - ')[0]:w.title;
  $('cf-process-name').value=w.process_name;
  $('cf-window-class').value=w.window_class;
  $('cfg-windows').textContent='已填入匹配规则，请确认标题稳定且唯一，保存后点击“探测窗口”。';
}

function cfgList(type){return {environment:cfgData.envs,executor:cfgData.execs,asset:cfgData.assets,device:cfgData.devices,requirement:cfgData.requirements}[type]||[];}

function cfgBindKind(){
  if(!cfgForm)return;
  if(cfgForm.type==='environment'){
    const kind=($('cf-kind')||{}).value;
    const offline=kind==='offline';
    const hw=$('cf-host-wrap'), pw=$('cf-port-wrap');
    if(hw) hw.style.display=offline?'none':'';
    if(pw) pw.style.display=offline?'none':'';
  }
  if(cfgForm.type==='asset'){
    const kind=($('cf-kind')||{}).value;
    const me=$('cf-asset-matcheval'), lo=$('cf-asset-locust');
    if(me) me.style.display=kind==='matcheval'?'':'none';
    if(lo) lo.style.display=kind==='locust'?'':'none';
    if($('cf-asset-ui'))$('cf-asset-ui').style.display=kind==='airtest'?'':'none';
  }
}

function cfgPayload(type){
  const val=id=>{const el=$(id);return el?el.value:'';};
  const num=id=>{const v=val(id);return v===''?0:Number(v);};
  const on=id=>{const el=$(id);return el?!!el.checked:true;};
  if(type==='requirement')return {name:val('cf-name').trim(),suite:val('cf-req-suite'),
    modules:[...document.querySelectorAll('.cf-req-module:checked')].map(x=>x.value),mongo_ref:val('cf-req-mongo'),
    notes:val('cf-notes'),enabled:on('cf-enabled')?1:0};
  if(type==='environment'){
    const kind=val('cf-kind');
    const p={name:val('cf-name').trim(),kind,protocol:val('cf-protocol'),
      secret_kind:val('cf-secret-kind'),secret_ref:val('cf-secret-ref').trim(),
      labels:val('cf-labels').split(',').map(s=>s.trim()).filter(Boolean),
      notes:val('cf-notes'),enabled:on('cf-enabled')?1:0};
    p.host=kind==='offline'?'':val('cf-host').trim();
    p.port=kind==='offline'?0:num('cf-port');
    return p;
  }
  if(type==='executor'){
    const runners=[...document.querySelectorAll('.cf-runner:checked')].map(x=>x.value);
    return {name:val('cf-name').trim(),python_ref:val('cf-python-ref'),cwd_root:val('cf-cwd-root'),
      allowed_runners:runners,max_concurrency:num('cf-max-concurrency')||1,
      notes:val('cf-notes'),enabled:on('cf-enabled')?1:0};
  }
  if(type==='device'){
    return {name:val('cf-name').trim(),executor_id:num('cf-device-executor'),
      title_match:val('cf-title-match').trim(),match_mode:val('cf-match-mode'),
      process_name:val('cf-process-name').trim(),window_class:val('cf-window-class').trim(),
      host:val('cf-device-host').trim(),port:num('cf-device-port'),unity_editor:on('cf-unity-editor')?1:0,
      smoke_selector:val('cf-smoke-selector').trim(),smoke_result:val('cf-smoke-result').trim(),
      notes:val('cf-notes'),enabled:on('cf-enabled')?1:0};
  }
  const kind=val('cf-kind');
  const p={name:val('cf-name').trim(),kind,notes:val('cf-notes'),enabled:on('cf-enabled')?1:0};
  if(kind==='airtest'){
    p.scenario_ref=val('cf-ui-suite');
  }else if(kind==='locust'){
    p.scenario_ref=val('cf-scenario-ref');
  }else{
    p.dataset_ref=val('cf-dataset-ref');p.tpl_ref=val('cf-tpl-ref');
    p.scenes_ref=val('cf-scenes-ref');p.ground_truth_ref=val('cf-ground-truth-ref');
    p.airtest_ref=val('cf-airtest-ref');
  }
  return p;
}

async function cfgSubmit(){
  const msg=$('cfg-form-msg'); if(msg) msg.textContent='保存中…';
  try{
    const {type,id}=cfgForm;
    const url=id?`${CFG_BASE[type]}/${id}`:CFG_BASE[type];
    await j(url,{method:id?'PUT':'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify(cfgPayload(type))});
    cfgForm=null; cfgPrecheck=null; await renderEnv();
  }catch(e){if(msg) msg.textContent='保存失败：'+e.message;}
}

async function cfgToggle(type,id){
  try{await j(`${CFG_BASE[type]}/${id}/toggle`,{method:'POST'});await renderEnv();}
  catch(e){alert('操作失败：'+e.message);}
}

async function cfgPrecheckNow(type,id){
  try{
    cfgPrecheck=await j(`${CFG_BASE[type]}/${id}/precheck`,{method:'POST'});
    const el=$('cfg-precheck');
    if(el){el.innerHTML=cfgPrecheckHtml(cfgPrecheck);el.scrollIntoView({behavior:'smooth',block:'center'});}
  }catch(e){alert('预检失败：'+e.message);}
}

function cfgPrecheckHtml(r){
  if(r&&r.checks&&r.checks.some(c=>c.status))return `<div class="card"><h2>${esc(r.entity||'预检')} · ${esc(r.name||'')}</h2>${runtimeChecksHtml(r.checks)}<p class="muted">结果只代表检查时刻；设备探测不代替计划的项目依赖检查。</p></div>`;
  if(!r)return '';
  const badge=r.ok===true?'<span class="ok">可运行</span>'
    :r.ok===false?'<span class="bad">缺少配置</span>':'<span class="muted">无需检查</span>';
  const checks=(r.checks||[]).map(c=>{
    const icon=c.ok===true?'✔':c.ok===false?'✘':'○';
    const cls=c.ok===false?'bad':c.ok===true?'ok':'muted';
    return `<li><span class="${cls}">${icon}</span> ${esc(c.name)}：${esc(c.detail||'')}</li>`;
  }).join('');
  const missing=(r.missing||[]).length?`<p class="bad" style="margin:8px 0 0">缺失项：${esc(r.missing.join('；'))}</p>`:'';
  const steps=(r.next_steps||[]).length?`<p class="muted" style="margin:6px 0 0">下一步：</p><ul>${r.next_steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ul>`:'';
  const fp=r.fingerprint?`<p class="muted" style="margin:6px 0 0">非敏感指纹：${esc(r.fingerprint)}${r.dir_fingerprint?' · 目录指纹 '+esc(r.dir_fingerprint):''}</p>`:'';
  return `<div class="card"><h2>预检结果 · ${esc(r.entity||'')} <span class="muted">${esc(r.name||'')}</span> ${badge}</h2>
    <div class="pre"><ul>${checks||'<li class="muted">（无检查项）</li>'}</ul>${missing}${steps}${fp}
    ${(r.windows||[]).map(w=>`<p>${esc(w.title)} · ${esc(w.process_name)} · ${esc(w.window_class)} · HWND ${esc(w.hwnd)}</p>`).join('')}</div></div>`;
}

// ---------- 计划编辑器（受控表单：新建/编辑/复制/版本信息/一键执行/预检；步骤增删上下移） ----------
const PL_ENGINES=['pytest','locust','matcheval','airtest'];
const PL_ALGOS=['tpl','mstpl','kaze','brisk','akaze','orb'];
let plCatalog=null, plRefs={envs:[],execs:[],assets:[],cases:[],suites:[]}, plForm=null, plPrecheck=null, plMsg='', plBusy=false;

async function plEnsureRefs(){
  const view=routeVersion;
  const[envs,execs,assets,cases,suites,cat]=await Promise.all([
    j('/api/environments'),j('/api/executors'),j('/api/asset-sources'),
    j('/api/test-cases?enabled=1'),j('/api/suites?enabled=1'),j('/api/config/catalog')]);
  if(view!==routeVersion)return;
  plCatalog=cat;
  plRefs={envs:envs.filter(e=>e.enabled),execs:execs.filter(e=>e.enabled),
          assets:assets.filter(a=>a.enabled),cases:cases,suites:suites};
}
function plEmptyStep(engine){return {kind:'inline',fresh:true,engine:engine||'pytest',name:'',requires_exclusive:false,params:{}};}
function plExecutorChanged(){plCollect();plRenderEditor();}
// 引用形态步骤：case_ref 固定 (id,revision,fingerprint)，override_params 只放与用例不同的键
function plEmptyCaseStep(cid){return {kind:'case',case_ref:cid||null,override_params:{},
  name:'',requires_exclusive:false,params:{}};}

async function renderPlanEditor(idStr){
  const app=$('app');
  const view=routeVersion;
  app.innerHTML='<h1>计划编辑器</h1><div class="card"><p class="muted">加载中…</p></div>';
  try{
    const isNew=(!idStr||idStr==='new');
    const [,p]=await Promise.all([plEnsureRefs(),isNew?Promise.resolve(null):j('/api/plans/'+idStr)]);
    if(view!==routeVersion)return;
    if(isNew){
      plForm={id:null,revision:null,created_at:null,updated_at:null,
        data:{name:'',description:'',environment_id:0,executor_id:0,asset_source_id:0,
          fail_fast:true,steps:[plEmptyStep('pytest')]}};
    }else{
      plForm={id:p.id,revision:p.revision??1,created_at:p.created_at,updated_at:p.updated_at,archived:!!p.archived,
        data:{name:p.name||'',description:p.description||'',environment_id:p.environment_id||0,
          executor_id:p.executor_id||0,asset_source_id:p.asset_source_id||0,
          fail_fast:!!p.fail_fast,
          // 透传点 8/9：引用了 TestCase 的步骤必须完整保留 case_ref / override_params，
          // 且 legacy 步骤不得被追加任何新键 —— 否则保存时会把用例引用丢掉。
          steps:(p.steps||[]).map(s=>s.case_ref
            ? {kind:'case',case_ref:{...s.case_ref},override_params:{...(s.override_params||{})},
               name:s.name||'',requires_exclusive:!!s.requires_exclusive,params:{}}
            : {kind:'inline',engine:s.engine,name:s.name||'',
               requires_exclusive:!!s.requires_exclusive,params:s.params||{}})
        }};
    }
    plPrecheck=null; plMsg='';
    plRenderEditor();
  }catch(e){if(view===routeVersion)app.innerHTML=`<div class="card err">加载计划失败：${esc(e.message)}</div>`;}
}

function plRenderEditor(){
  const app=$('app'); const f=plForm; if(!f)return;
  const d=f.data;
  const stepsHtml=d.steps.map((s,i)=>plStepCard(s,i)).join('')||'<p class="muted">暂无步骤，请添加。</p>';
  app.innerHTML=`<h1>计划编辑器 <span class="muted">${f.id?('#'+f.id+' · rev '+(f.revision??1)):'新建'}</span></h1>
    ${f.archived?`<div class="card hint-warn"><strong>已归档 · 只读查看</strong><p>恢复后可编辑和执行；计划版本与历史报告保持不变。</p><button onclick="plChangeArchive(${f.id},false,true)">恢复计划</button><span id="pl-msg" role="status"></span></div>`:''}
    <fieldset ${f.archived?'disabled':''} style="border:0;padding:0;margin:0;min-width:0">
    <div class="card">
      <div class="row"><h2 style="margin:0">基础信息</h2>
        <a href="#/plans" class="muted" style="margin-left:auto">返回计划列表</a></div>
      <div class="form-grid" style="margin-top:12px">
        <label>名称<input id="pl-name" value="${esc(d.name)}" placeholder="计划名称"></label>
        <label>说明<input id="pl-desc" value="${esc(d.description)}" placeholder="用途/范围说明"></label>
        <label>Environment（仅启用）<select id="pl-env">${plEnvOpts(d.environment_id)}</select></label>
        <label>Executor（仅启用）<select id="pl-exec" onchange="plExecutorChanged()">${plExecOpts(d.executor_id)}</select></label>
        <label>AssetSource（仅启用且兼容）<select id="pl-asset">${plAssetOpts(d.asset_source_id)}</select></label>
        <label class="inline"><input id="pl-failfast" type="checkbox" ${d.fail_fast?'checked':''}> 失败即停（fail_fast）</label>
      </div>
      ${f.id?`<p class="muted" style="margin-top:10px">版本 rev ${f.revision??1} · 创建 ${esc(f.created_at||'-')} · 更新 ${esc(f.updated_at||'-')}。每次保存编辑 revision +1；执行时固化当时的版本与快照。</p>`
        :'<p class="muted" style="margin-top:10px">新建计划初始 rev 1；执行时固化快照。</p>'}
    </div>
    <div class="card">
      <div class="row"><h2 style="margin:0">执行步骤（默认串行）</h2>
        <select id="pl-suite-pick" style="margin-left:auto" title="选择一个测试套件，展开为若干用例步骤">${plSuiteOpts()}</select>
        <button onclick="plAddSuiteSteps()">插入测试套件</button>
        <button onclick="plAddStep()">添加内联步骤</button>
        <button onclick="plAddCaseStep()">添加用例步骤</button></div>
      <p class="muted" style="margin:6px 0 0">内联步骤把参数直接写进本计划（legacy 形态）；
        用例步骤只保存对 TestCase 的引用（id + revision + 指纹）与本计划的参数覆盖，执行时再展开。<br>
        <b>插入测试套件</b>只在<b>编辑阶段</b>把套件展开成等价的用例步骤（可再单独增删调序）；
        套件本身<b>不会</b>被写进计划，保存的仍是普通步骤。</p>
      <div style="margin-top:10px">${stepsHtml}</div>
    </div>
    <div class="card">
      <div class="row">
        <button class="primary" onclick="plSave(false)">保存</button>
        <button onclick="plSave(true)">保存并执行</button>
        <button onclick="plRunPrecheck()">预检 / 执行预览</button>
        ${f.archived?'':`<span class="muted" id="pl-msg">${esc(plMsg||'')}</span>`}
      </div>
    </div>
    </fieldset><div id="pl-precheck-host">${plPrecheck?plPrecheckHtml(plPrecheck):''}</div>`;
}

function plStepCard(s,i){
  const isCase=s.kind==='case';
  const up=i>0?`<button onclick="plStepMove(${i},-1)">上移</button>`:'';
  const down=i<plForm.data.steps.length-1?`<button onclick="plStepMove(${i},1)">下移</button>`:'';
  const head = isCase
    ? `<strong>步骤 ${i+1}</strong><span class="chip">引用用例</span>
       <select id="pl-s${i}-case-ref" onchange="plPickCase(${i},this.value)">${plCaseOpts(s.case_ref&&s.case_ref.id)}</select>`
    : `<strong>步骤 ${i+1}</strong><span class="chip">内联</span>
       <select id="pl-s${i}-engine" onchange="plStepEngine(${i},this.value)">${
         PL_ENGINES.map(e=>`<option value="${e}" ${s.engine===e?'selected':''}>${e}</option>`).join('')}</select>`;
  return `<div class="card" style="background:var(--bg2);margin-bottom:10px">
    <div class="row">${head}
      <span style="margin-left:auto"></span>
      <button onclick="plToggleKind(${i})">${isCase?'改为内联步骤':'改为引用用例'}</button>
      ${up}${down}
      <button onclick="plStepDel(${i})">删除</button></div>
    <div class="form-grid" style="margin-top:10px">${plStepFields(s,i)}</div></div>`;
}

function plFindCase(cid){return (plRefs.cases||[]).find(c=>String(c.id)===String(cid))||null;}
function plCaseOpts(cur){
  const list=plRefs.cases||[];
  if(!list.length) return '<option value="">（暂无可用的已启用用例）</option>';
  return `<option value="">（选择用例）</option>`+list.map(c=>
    `<option value="${c.id}" ${String(cur)===String(c.id)?'selected':''}>${esc(c.name)} · ${esc(c.engine)} · rev${c.revision}</option>`).join('');
}
function plToggleKind(i){
  plCollect();
  const s=plForm.data.steps[i];
  plForm.data.steps[i] = (s.kind==='case') ? plEmptyStep('pytest') : plEmptyCaseStep('');
  plRenderEditor();
}
function plAddCaseStep(){plCollect();plForm.data.steps.push(plEmptyCaseStep(''));plRenderEditor();}

// ---- 测试套件：**编辑期**展开为普通用例步骤 ----
// 规则（与架构审计 §7 一致）：
//   · 展开发生在编辑阶段，产物是 kind:'case' 的普通步骤 —— 与手动「添加用例步骤」完全等价；
//   · 套件本身**不进入** plans.steps（不写 suite_ref，不写 suite 定义）；
//   · 展开后用户仍可对单个步骤增删 / 上下移 / 改覆盖参数；
//   · 顺序 = 套件里 cases 数组的顺序，插入到列表末尾。
function plSuiteOpts(){
  const list=plRefs.suites||[];
  if(!list.length) return '<option value="">（暂无可用的已启用套件）</option>';
  return `<option value="">（选择套件）</option>`+list.map(s=>
    `<option value="${s.id}">${esc(s.name)} · ${(s.cases||[]).length} 个用例 · rev${s.revision}</option>`
  ).join('');
}
function plAddSuiteSteps(){
  plCollect();
  const sel=$('pl-suite-pick');
  const sid=sel?Number(sel.value)||0:0;
  if(!sid){ plMsg='请先选择要插入的测试套件'; plRenderEditor(); return; }
  const s=(plRefs.suites||[]).find(x=>Number(x.id)===sid);
  if(!s){ plMsg='套件不存在或已停用，请刷新后重试'; plRenderEditor(); return; }
  const cs=s.cases||[];
  if(!cs.length){ plMsg=`套件「${s.name}」不含任何用例，无法展开`; plRenderEditor(); return; }
  const unavailable=[];
  const added=cs.map(c=>{
    const tc=plFindCase(c.id);
    if(!tc) unavailable.push(c.id);
    return {kind:'case',
      // ⚠️ 只带 case_ref（(id, revision, fingerprint) 三元组），**不带 suite_ref**
      case_ref:{id:c.id,revision:c.revision,fingerprint:c.fingerprint},
      override_params:{},
      name:tc?tc.name:('用例#'+c.id),
      requires_exclusive:tc?!!tc.requires_exclusive:false,
      params:{}};
  });
  plForm.data.steps=plForm.data.steps.concat(added);
  plMsg=`已从套件「${s.name}」rev${s.revision} 展开 ${added.length} 个用例步骤`
       +(unavailable.length
          ? `；⚠️ 其中 ${unavailable.length} 个用例当前不可用（id=${unavailable.join('、')}），保存时后端会如实报错`
          : '')
       +'。保存的是普通步骤，不含套件引用。';
  plRenderEditor();
}
function plPickCase(i,cid){
  plCollect();
  const tc=plFindCase(cid?Number(cid):null);
  plForm.data.steps[i]={kind:'case',
    case_ref: tc?{id:tc.id,revision:tc.revision,fingerprint:tc.fingerprint}:null,
    override_params:{}, name:tc?tc.name:'',
    requires_exclusive:tc?!!tc.requires_exclusive:false, params:{}};
  plRenderEditor();
}

function plStepFields(s,i){
  const isCase=s.kind==='case';
  const tc=isCase?plFindCase(s.case_ref&&s.case_ref.id):null;
  if(isCase&&!tc){
    return `<div style="grid-column:1/-1"><span class="err">请先选择要引用的 TestCase。</span></div>`;
  }
  // 用例步骤：表单展示"用例定义 ⊕ override"的最终有效值；收集时自动把与用例不同的项转成 override
  const p = isCase ? {...(tc.params||{}),...(s.override_params||{})} : (s.params||{});
  const eng = isCase ? tc.engine : s.engine;
  const tip = isCase ? `<div style="grid-column:1/-1" class="muted">
      引用用例 #${tc.id}「${esc(tc.name)}」rev${tc.revision} · 定义指纹 <code>${esc(tc.fingerprint)}</code>。
      下方参数中<b>与用例不同的项</b>将自动记为 override_params（只允许调整该用例<b>已声明</b>的参数）。
      <a href="#/cases" style="margin-left:6px">管理用例 →</a></div>` : '';
  const common=`<label>步骤名<input id="pl-s${i}-name" value="${esc(s.name||'')}" placeholder="默认为引擎名/用例名"></label>
    <label>超时(秒)<input id="pl-s${i}-timeout" type="number" min="1" value="${p.timeout_sec??PL_DEFAULTED.pytest.timeout_sec}"></label>
    <label class="inline"><input id="pl-s${i}-excl" type="checkbox" ${(eng==='airtest'||s.requires_exclusive)?'checked':''} ${eng==='airtest'?'disabled':''}> 独占执行机（UI/Unity 类）</label>`;
  if(eng==='airtest'){
    const A=(plCatalog&&plCatalog.asset)||{};
    const suite=p.suite||((A.ui_suites||[])[0]||{}).key||'';
    const opts=(items,sel)=>items.map(x=>`<option value="${esc(x.key)}" ${x.key===sel?'selected':''}>${esc(x.label)}</option>`).join('');
    const cases=(A.ui_cases||{})[suite]||[];
    return tip+common+`<label>UI 套件<select id="pl-s${i}-suite" onchange="plUIChange('${i}')">${opts(A.ui_suites||[],suite)}</select></label>
      <label>公共运行要求<select id="pl-s${i}-requirements">${plRequirementOpts(suite,p.requirements)}</select></label>
      <label>已登记用例<select id="pl-s${i}-case">${cases.map(c=>`<option value="${esc(c)}" ${c===p.case?'selected':''}>${esc(c)}</option>`).join('')}</select></label>
      <label>目标设备<select id="pl-s${i}-device"><option value="">请选择已登记设备</option>${(A.ui_devices||[]).map(x=>{
        const unavailable=x.enabled===0||(i!=='c'&&plForm&&x.executor_id&&Number(plForm.data.executor_id)!==x.executor_id);
        return `<option value="${esc(x.key)}" ${x.key===p.device?'selected':''} ${unavailable?'disabled':''}>${esc(x.label)}${unavailable?'（停用或执行机不匹配）':''}</option>`;
      }).join('')}</select></label>
      <label>等待超时(秒)<input id="pl-s${i}-wait" type="number" min="1" max="120" value="${p.wait_timeout??PL_DEFAULTED.airtest.wait_timeout}"></label>
      <label>复位策略<select id="pl-s${i}-reset"><option value="none">用例自行检查初始状态</option></select></label>
      <div class="muted">计划预检会只读探测窗口、Poco 和项目依赖；执行前重新检查。GameAutoTest 用例执行时会创建/清理测试账号，预检不写入数据。<a href="#/env">管理公共运行要求 →</a></div>`;
  }
  if(eng==='pytest'){
    return tip+common+`<label style="grid-column:1/-1">已登记 pytest 入口（可选）<select id="pl-s${i}-entry" onchange="plPytestEntryChange('${i}')"><option value="">自定义受控项目内选择器</option>${((plCatalog&&plCatalog.pytest_entries)||[]).map(e=>`<option value="${esc(e.key)}" ${p.entry===e.key?'selected':''}>${esc(e.label)}</option>`).join('')}${p.entry&&!((plCatalog&&plCatalog.pytest_entries)||[]).some(e=>e.key===p.entry)?`<option selected value="${esc(p.entry)}">原入口 ${esc(p.entry)}（不可用）</option>`:''}</select></label><label style="grid-column:1/-1">测试选择器 / 参数（空格分隔；仅相对路径与开关，不接受绝对路径或命令）
      <input id="pl-s${i}-args" value="${esc((p.args||[]).join(' '))}" placeholder="demo/test_platform_demo.py -o addopts= --tb=short"></label>
      <label>工作目录根（受控）<select id="pl-s${i}-cwd-root">${plRootOpts(p.cwd_root)}</select></label>`;
  }
  if(eng==='locust'){
    return tip+common+`<label>场景（受控引用）<select id="pl-s${i}-locustfile">${plScenarioOpts(p.locustfile)}</select></label>
      <label>并发用户数 users<input id="pl-s${i}-users" type="number" min="1" value="${p.users??PL_DEFAULTED.locust.users}"></label>
      <label>启动速率 spawn_rate<input id="pl-s${i}-spawn" type="number" min="1" value="${p.spawn_rate??PL_DEFAULTED.locust.spawn_rate}"></label>
      <label>运行时长 run_time<input id="pl-s${i}-runtime" value="${esc(p.run_time||PL_DEFAULTED.locust.run_time)}" placeholder="如 15s / 1m"></label>
      <label class="inline"><input id="pl-s${i}-csv" type="checkbox" ${p.csv_full_history?'checked':''}> 记录完整 CSV 历史</label>`;
  }
  return tip+common+`<label>样本集 dataset（受控引用）<select id="pl-s${i}-dataset">${plDatasetOpts(p.dataset)}</select></label>
    <label>阈值 threshold（0..1）<input id="pl-s${i}-threshold" type="number" min="0" max="1" step="0.01" value="${p.threshold??PL_DEFAULTED.matcheval.threshold}"></label>
    <label>输出级别 output_level<select id="pl-s${i}-output-level">${plOutOpts(p.output_level)}</select></label>
    <div style="grid-column:1/-1"><div class="muted">算法（受控白名单，多选）</div>
      <div class="row">${PL_ALGOS.map(a=>`<label class="inline"><input type="checkbox" class="pl-alg-${i}" value="${a}" ${(p.algorithm||[]).includes(a)?'checked':''}> ${a}</label>`).join('')}</div></div>`;
}

function plEnvOpts(cur){
  return `<option value="0" ${!cur?'selected':''}>（未选择）</option>`+
    plRefs.envs.map(e=>`<option value="${e.id}" ${String(cur)===String(e.id)?'selected':''}>${esc(e.name)} · ${esc(e.kind)}</option>`).join('');
}
function plExecOpts(cur){
  return `<option value="0" ${!cur?'selected':''}>（未选择）</option>`+
    plRefs.execs.map(x=>`<option value="${x.id}" ${String(cur)===String(x.id)?'selected':''}>${esc(x.name)} · ${esc((x.allowed_runners||[]).join('/')||'—')}</option>`).join('');
}
function plAssetOpts(cur){
  // 用例步骤的引擎取自其引用的用例（步骤本身不保存 engine）
  const kinds=new Set(plForm.data.steps.map(s=>{
    const eng = s.kind==='case' ? (plFindCase(s.case_ref&&s.case_ref.id)||{}).engine : s.engine;
    return eng==='locust'?'locust':eng==='matcheval'?'matcheval':eng==='airtest'?'airtest':null;
  }).filter(Boolean));
  const list=plRefs.assets.filter(a=>kinds.size===0||kinds.has(a.kind));
  return `<option value="0" ${!cur?'selected':''}>（不指定）</option>`+
    list.map(a=>`<option value="${a.id}" ${String(cur)===String(a.id)?'selected':''}>${esc(a.name)} · ${esc(a.kind)}</option>`).join('');
}
function plKeyOpts(items,cur,placeholder){
  return `<option value="" ${!cur?'selected':''}>${placeholder}</option>`+
    items.map(o=>`<option value="${esc(o.key)}" ${cur===o.key?'selected':''}>${esc(o.label)}</option>`).join('');
}
function plRootOpts(cur){
  return plKeyOpts((plCatalog&&plCatalog.workdir_roots)||[],cur,'（不指定）');
}
function plScenarioOpts(cur){
  return plKeyOpts((plCatalog&&plCatalog.asset&&plCatalog.asset.locust_scenarios)||[],cur,'（选择受控场景）');
}
function plDatasetOpts(cur){
  return plKeyOpts((plCatalog&&plCatalog.asset&&plCatalog.asset.datasets)||[],cur,'（选择受控样本集）');
}
function plOutOpts(cur){
  return ['summary','full'].map(k=>`<option value="${k}" ${(cur||PL_DEFAULTED.matcheval.output_level)===k?'selected':''}>${k}</option>`).join('');
}

function plUIChange(i){
  const suite=$(`pl-s${i}-suite`).value;
  const cases=((plCatalog&&plCatalog.asset&&plCatalog.asset.ui_cases)||{})[suite]||[];
  $(`pl-s${i}-case`).innerHTML=cases.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('');
  const req=$(`pl-s${i}-requirements`);
  if(req)req.innerHTML=plRequirementOpts(suite,'');
}
function plRequirementOpts(suite,current){
  const list=((plCatalog&&plCatalog.runtime_requirements)||[]).filter(r=>!r.suite||r.suite===suite);
  const selectedMissing=current&&!list.some(r=>r.key===current);
  return `<option value="" ${!current?'selected':''}>继承套件默认（${suite==='gameautotest-ui'?'MMO Unity 公共要求':'Unity / Poco 公共要求'}）</option>`+
    (selectedMissing?`<option value="${esc(current)}" selected>原引用 ${esc(current)}（不可用，请重新选择）</option>`:'')+
    list.map(r=>`<option value="${esc(r.key)}" ${r.key===current?'selected':''} ${r.enabled?'':'disabled'}>${esc(r.name)}${r.enabled?'':'（已停用）'}</option>`).join('');
}
function plReadParams(i,eng){
  const v=id=>{const el=$(id);return el?el.value:'';};
  const num=id=>{const el=$(id);const t=el?el.value:'';return t===''?null:Number(t);};
  const on=id=>{const el=$(id);return el?!!el.checked:false;};
  const p={};
  const to=num(`pl-s${i}-timeout`); if(to)p.timeout_sec=to;
  if(eng==='pytest'){
    const entry=v(`pl-s${i}-entry`);if(entry)p.entry=entry;
    const raw=v(`pl-s${i}-args`).trim(); if(raw)p.args=raw.split(/\s+/);
    const cr=v(`pl-s${i}-cwd-root`); if(cr)p.cwd_root=cr;
  }else if(eng==='airtest'){
    p.suite=v(`pl-s${i}-suite`);p.case=v(`pl-s${i}-case`);p.device=v(`pl-s${i}-device`);
    const req=v(`pl-s${i}-requirements`);if(req)p.requirements=req;
    p.wait_timeout=num(`pl-s${i}-wait`)??PL_DEFAULTED.airtest.wait_timeout;p.reset=v(`pl-s${i}-reset`)||PL_DEFAULTED.airtest.reset;
  }else if(eng==='locust'){
    const lf=v(`pl-s${i}-locustfile`); if(lf)p.locustfile=lf;
    p.users=num(`pl-s${i}-users`)||1;
    p.spawn_rate=num(`pl-s${i}-spawn`)||1;
    p.run_time=v(`pl-s${i}-runtime`)||PL_DEFAULTED.locust.run_time;
    p.csv_full_history=on(`pl-s${i}-csv`);
  }else{
    const ds=v(`pl-s${i}-dataset`); if(ds)p.dataset=ds;
    p.threshold=num(`pl-s${i}-threshold`);
    p.output_level=v(`pl-s${i}-output-level`)||PL_DEFAULTED.matcheval.output_level;
    const algs=[...document.querySelectorAll(`.pl-alg-${i}:checked`)].map(x=>x.value);
    if(algs.length)p.algorithm=algs;
  }
  return p;
}
// ---- 内联步骤的参数合并：保证"打开旧计划 → 原样保存"不改变 steps ----
// 背景（v0.2 遗留）：plReadParams 会按表单布局重新组装 params，因此单纯"打开即保存"
// 就会（a）重排键序、（b）丢掉表单没有渲染的键、（c）为"有缺省回退"的键凭空注入默认值。
// 其中 (c) 会改变 plan_snapshot 指纹（(a) 不会 —— 快照哈希用 sort_keys，键序无关）。
// 规则：以原 params 为基底合并 —— 保键序、保留未管理的键；有缺省回退的键只在
// "原本已声明"或"用户改成非默认值"时才写入；表单没产出 = 用户清空 → 删除该键。
// 新建步骤（fresh）保持原有行为不变，避免影响新计划的默认值体验。
const PL_MANAGED_KEYS={pytest:['args','cwd_root','entry','timeout_sec'],
  locust:['locustfile','users','spawn_rate','run_time','csv_full_history','timeout_sec'],
  matcheval:['dataset','threshold','output_level','algorithm','timeout_sec'],
  airtest:['suite','case','device','requirements','wait_timeout','reset','timeout_sec']};
// 表单展示和保真合并共用默认值。清空控件后的读取兜底（如 users=1）
// 以及 Runner 的执行默认值保留各自现有语义，不在这里合并。
const PL_DEFAULTED={
  pytest:{timeout_sec:300},
  locust:{users:5,spawn_rate:2,run_time:'15s',csv_full_history:false,timeout_sec:300},
  matcheval:{threshold:0.8,output_level:'summary',timeout_sec:300},
  airtest:{wait_timeout:10,reset:'none',timeout_sec:300}};
function plMergeParams(orig,built,eng,fresh){
  if(fresh) return built;                      // 新建步骤：沿用原行为
  const managed=PL_MANAGED_KEYS[eng]||[], dflt=PL_DEFAULTED[eng]||{};
  const out={};
  Object.keys(orig).forEach(k=>{
    if(!managed.includes(k)){out[k]=orig[k];return;}   // 表单不管理的键（如 legacy 里的 cwd）原样保留
    if(k in built) out[k]=built[k];                    // 用户清空 → k 不在 built → 不写（等于删除）
  });
  Object.keys(built).forEach(k=>{
    if(k in out) return;
    if(k in dflt && JSON.stringify(built[k])===JSON.stringify(dflt[k])) return;  // 仍是缺省回退 → 不凭空注入
    out[k]=built[k];
  });
  return out;
}
function plCollectStep(i){
  const s=plForm.data.steps[i]; if(!s)return;
  const v=id=>{const el=$(id);return el?el.value:'';};
  const on=id=>{const el=$(id);return el?!!el.checked:false;};
  if(s.kind==='case'){
    const tc=plFindCase(s.case_ref&&s.case_ref.id);
    if(!tc){ s.params={}; s.override_params={}; return; }
    const cur=plReadParams(i,tc.engine);
    s.params=cur;
    s.name=v(`pl-s${i}-name`)||tc.name;
    s.requires_exclusive=on(`pl-s${i}-excl`);
    // 只对**用例已声明**的参数做差异比对：表单对未声明的键会填引擎默认值，
    // 若一并比对会把默认值误记成"覆盖"。UI 只允许调整用例已声明的参数；
    // 需要补充白名单内的其它键时，仍可通过 API 提交 override_params。
    const base=tc.params||{}, ov={};
    Object.keys(base).forEach(k=>{
      if(JSON.stringify(cur[k])!==JSON.stringify(base[k])) ov[k]=cur[k];
    });
    // This optional resource reference may be added to old cases or explicitly
    // reset to inherited defaults without changing the referenced TestCase.
    if(tc.engine==='airtest'){
      const req=v(`pl-s${i}-requirements`);
      if(req!==(base.requirements||''))ov.requirements=req;
      else delete ov.requirements;
    }
    s.override_params=ov;
    return;
  }
  s.name=v(`pl-s${i}-name`)||s.engine;
  s.requires_exclusive=on(`pl-s${i}-excl`);
  // 保键序 / 保留未管理键 / 不凭空注入默认值（见 plMergeParams 注释）
  s.params=plMergeParams(s.params||{}, plReadParams(i,s.engine), s.engine, !!s.fresh);
}
function plCollect(){
  const f=plForm; if(!f)return;
  const v=id=>{const el=$(id);return el?el.value:'';};
  const on=id=>{const el=$(id);return el?!!el.checked:false;};
  f.data.name=v('pl-name').trim();
  f.data.description=v('pl-desc');
  f.data.environment_id=Number(v('pl-env'))||0;
  f.data.executor_id=Number(v('pl-exec'))||0;
  f.data.asset_source_id=Number(v('pl-asset'))||0;
  f.data.fail_fast=on('pl-failfast');
  f.data.steps.forEach((_,i)=>plCollectStep(i));
}
function plPayload(){
  plCollect();
  const d=plForm.data;
  return {name:d.name,description:d.description,environment_id:d.environment_id,
    executor_id:d.executor_id,asset_source_id:d.asset_source_id,
    // 透传点 9：用例步骤输出引用形态（case_ref + override_params），
    // legacy 内联步骤维持原四键形态，不加任何新键。
    steps:d.steps.map(s=> s.kind==='case'
      ? {case_ref:{...(s.case_ref||{})},
         override_params:{...(s.override_params||{})},
         ...(s.name?{name:s.name}:{}),
         requires_exclusive:!!s.requires_exclusive}
      : {engine:s.engine,name:s.name,requires_exclusive:s.requires_exclusive,params:s.params}),
    fail_fast:d.fail_fast,owner:'local'};
}

function plAddStep(){plCollect();plForm.data.steps.push(plEmptyStep('pytest'));plRenderEditor();}
function plStepDel(i){plCollect();plForm.data.steps.splice(i,1);plRenderEditor();}
function plStepMove(i,dir){
  plCollect();
  const st=plForm.data.steps, j=i+dir;
  if(j<0||j>=st.length)return;
  [st[i],st[j]]=[st[j],st[i]];
  plRenderEditor();
}
function plStepEngine(i,eng){
  plCollectStep(i);              // 先用旧引擎字段收集，避免输入丢失
  plForm.data.steps[i].engine=eng;
  plForm.data.steps[i].params={}; // 切换引擎后参数不再适用，重置
  plRenderEditor();
}

async function plSave(andRun){
  if(plForm&&plForm.archived){$('pl-msg').textContent='该计划已归档，请先恢复';return;}
  if(plBusy)return;
  plBusy=true;
  const msg=$('pl-msg'); if(msg)msg.textContent='保存中…';
  try{
    const body=plPayload();
    if(!body.name)throw new Error('名称必填');
    if(!body.steps.length)throw new Error('至少需要一个执行步骤');
    const noCase=body.steps.findIndex(s=>!s.engine&&!(s.case_ref&&s.case_ref.id));
    if(noCase>=0)throw new Error(`步骤 ${noCase+1} 尚未选择要引用的 TestCase`);
    let pid=plForm.id;
    if(pid){
      await j('/api/plans/'+pid,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    }else{
      const out=await j('/api/plans',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
      pid=out.id;
    }
    if(andRun){
      const out=await j(`/api/plans/${pid}/run`,{method:'POST'});
      location.hash='#/run/'+out.run_id;
    }else{
      await renderPlanEditor(String(pid));   // 重新载入以反映递增后的 revision
    }
  }catch(e){if(msg)msg.textContent='保存失败：'+e.message;}
  finally{plBusy=false;}
}

function plPrecheckHtml(r){
  if(!r)return '';
  const badge=r.ok===true?'<span class="ok">本次检查通过</span>'
    :r.ok===false?'<span class="bad">预检未通过</span>':'<span class="muted">无需检查</span>';
  const stepRows=(r.steps||[]).map(s=>{
    const marks=[['引擎已注册',s.engine_registered],['参数合法',s.params_ok],
      ['执行机允许',s.executor_allows],['依赖就绪',s.deps_ready]]
      .map(([n,ok])=>`<span class="${ok?'ok':'bad'}" style="margin-right:8px">${ok?'✔':'✘'} ${n}</span>`).join('');
    const errs=(s.params_errors||[]).map(e=>`<li>${esc(e)}</li>`).join('');
    return `<tr><td>${s.index+1}</td><td><strong>${esc(s.engine)}</strong><div class="muted">${esc(s.name||'')}</div></td>
      <td>${marks}</td><td class="muted">${esc(JSON.stringify(s.params||{}))}${errs?`<ul class="bad">${errs}</ul>`:''}</td></tr>`;
  }).join('');
  const cfg=r.config||{};
  // 配置就绪度四态（清晰区分）：必须满足但缺失(红) / 仅供参考(黄) / 不适用(灰) / 未引用(灰)
  // requirement 由后端按步骤是否声明服务依赖给出；ok===null 表示不适用。
  const cfgRow=(label,pc)=>{
    if(!pc)return `<tr><td>${label}</td><td><span class="st-na">未引用</span></td><td class="muted">—</td></tr>`;
    const det=esc((pc.missing||[]).join('；')||'—');
    if(pc.ok===true)return `<tr><td>${label}</td><td><span class="st-ok">就绪</span></td><td class="muted">${det}</td></tr>`;
    if(pc.ok===false&&pc.requirement==='required')return `<tr><td>${label}</td><td><span class="st-bad">缺失</span></td><td class="muted">${det} · 本计划声明依赖此服务，必须可达</td></tr>`;
    if(pc.ok===false)return `<tr><td>${label}</td><td><span class="st-warn">仅供参考</span></td><td class="muted">${det} · 本计划未声明依赖此服务，不阻断预检</td></tr>`;
    return `<tr><td>${label}</td><td><span class="st-na">不适用</span></td><td class="muted">${det}</td></tr>`;
  };
  const conc=r.concurrency||{}, ff=r.fail_fast||{};
  const missing=(r.missing||[]).length?`<p class="bad" style="margin:8px 0 0">缺失项：${esc(r.missing.join('；'))}</p>`:'';
  const notices=(r.notices||[]).length?`<div class="hint-warn"><strong>提示（不阻断预检）：</strong><ul>${r.notices.map(s=>`<li>${esc(s)}</li>`).join('')}</ul></div>`:'';
  const nxt=(r.next_steps||[]).length?`<p class="muted" style="margin:6px 0 0">下一步：</p><ul>${r.next_steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ul>`:'';
  const runtime=(r.steps||[]).filter(s=>s.engine==='airtest').map(s=>`<div style="margin-top:12px"><strong>步骤 ${s.index+1} · ${esc(s.name||'airtest')} · 公共运行要求</strong>
    ${s.runtime?runtimeChecksHtml(s.runtime.checks):'<p class="st-warn">未探测：请先修复本步骤的参数、执行机或引擎依赖。</p>'}</div>`).join('');
  return `<div class="card"><h2>预检 / 执行预览 <span class="muted">${esc(r.name||'')} · rev ${r.revision??'-'}</span> ${badge}</h2>
    <p class="muted">${r.precheck_mode==='realtime'?'实时预检（只读探测）':'配置预检（客户端未探测）'} · ${esc(r.checked_at||'')}。结果仅代表检查时刻，执行前仍会重新检查客户端。</p>
    <p class="muted">步骤顺序与解析后的引擎：</p>
    <table><thead><tr><th>#</th><th>引擎</th><th>就绪项</th><th>参数</th></tr></thead>
      <tbody>${stepRows||'<tr><td colspan=4 class="muted">无步骤</td></tr>'}</tbody></table>
    <p class="muted" style="margin-top:10px">配置就绪度：</p>
    <table><thead><tr><th>配置</th><th>状态</th><th>缺失</th></tr></thead><tbody>
      ${cfgRow('Environment',cfg.environment)}${cfgRow('Executor',cfg.executor)}${cfgRow('AssetSource',cfg.asset_source)}</tbody></table>
    ${runtime}
    <div class="pre" style="margin-top:10px">
      <div>并发 / 锁：执行机独占锁${conc.exclusive_lock_held?`<span class="bad"> ${conc.holder_job_id<0?'正在实时探测':'已被 Job #'+conc.holder_job_id+' 持有'}</span>`:'<span class="ok"> 空闲</span>'} · 全局串行${conc.run_in_progress?'<span class="muted">（有进行中的 PlanRun）</span>':''}</div>
      <div>fail_fast：${ff.enabled?'<span class="ok">开启</span>':'<span class="muted">关闭</span>'} —— ${esc(ff.behavior||'')}</div>
      ${missing}${notices}${nxt}
      <p class="muted" style="margin:6px 0 0">预检使用隔离探测进程，不创建 PlanRun/Job、不点击客户端、不写入数据库业务数据、不运行测试用例${r.fingerprint?` · 非敏感指纹 ${esc(r.fingerprint)}`:''}。</p>
    </div></div>`;
}

      <p class="muted" style="margin-top:8px">参数与计划步骤共用同一套白名单校验；<code>asset_source_id</code> 属计划/执行级，不能写在用例里。</p>
    </div>`}`;
}
function tcSetEngine(v){ plCollectTc(); tcEdit.engine=v; tcEdit.params={};
  tcEdit.asset_kind=TC_ASSET_KIND[v]||''; tcRender(); }
function tcNew(){return tcOpen(null);}
function tcCancel(){tcFormSeq++;tcEdit=null;tcMsg='';tcRender();}
function tcLoad(id){return tcOpen(id);}
async function tcOpen(id){
  const view=routeVersion,seq=++tcFormSeq;
  plCollectTc();
  tcMsg='加载表单配置中…';tcRender();
  try{
    const catalog=await j('/api/config/catalog');
    if(view!==routeVersion||seq!==tcFormSeq)return;
    const c=id?tcList.find(x=>x.id===id):tcBlank();if(!c)return;
    plCatalog=catalog;tcEdit=structuredClone(c);
    tcMsg='';tcRender();focusForm('tc-form');
  }catch(e){if(view===routeVersion&&seq===tcFormSeq){tcMsg='表单配置加载失败，请重新点击新建或编辑：'+e.message;tcRender();}}
}
function plCollectTc(){
  if(!tcEdit)return;
  const el=$('pl-sc-name'); if(!el)return;
  tcEdit.name=el.value.trim();
  tcEdit.description=($('pl-sc-desc')||{}).value||'';
  tcEdit.asset_kind=($('tc-asset-kind')||{}).value||'';
  tcEdit.tags=(($('tc-tags')||{}).value||'').split(',').map(s=>s.trim()).filter(Boolean);
  tcEdit.requires_exclusive=!!($('pl-sc-excl')&&$('pl-sc-excl').checked);
  tcEdit.params=plReadParams('c',tcEdit.engine);
}
async function tcSave(){
  if(tcBusy)return; tcBusy=true;
  const msg=$('tc-msg'); if(msg)msg.textContent='保存中…';
  try{
    plCollectTc();
    const body={name:tcEdit.name,description:tcEdit.description,engine:tcEdit.engine,
      params:tcEdit.params,requires_exclusive:!!tcEdit.requires_exclusive,
      asset_kind:tcEdit.asset_kind||'',tags:tcEdit.tags||[],owner:tcEdit.owner||'local'};
    if(!body.name)throw new Error('名称必填');
    const saved = tcEdit.id
      ? await j('/api/test-cases/'+tcEdit.id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
      : await j('/api/test-cases',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    tcList=await j('/api/test-cases');
    tcEdit=null;
    tcMsg=`已保存 · rev ${saved.revision} · 指纹 ${saved.fingerprint}`;
    tcRender();
  }catch(e){if(msg)msg.textContent='保存失败：'+e.message;}
  finally{tcBusy=false;}
}
async function tcToggle(id){
  try{ await j(`/api/test-cases/${id}/toggle`,{method:'POST'});
       tcList=await j('/api/test-cases'); tcRender(); }
  catch(e){alert('操作失败：'+e.message);}
}
async function tcDelete(id){
  if(!confirm('确认删除用例 #'+id+'？（被计划引用的用例会被拒绝删除）'))return;
  try{ await j(`/api/test-cases/${id}`,{method:'DELETE'});
       if(tcEdit&&tcEdit.id===id)tcEdit=null;
       tcList=await j('/api/test-cases'); tcMsg='已删除 #'+id; tcRender(); }
  catch(e){alert('删除失败：'+e.message);}
}

// Suite 只描述「引用哪些用例、按什么顺序」；不绑定环境 / 执行机 / 资产，**不参与执行链**
// （不产生 PlanRun / Job / 报告，也没有任何"执行套件"入口）。
// 它只在**计划编辑阶段**被展开成普通的用例步骤。
let tsList=[], tsEdit=null, tsMsg='', tsBusy=false, tsFormSeq=0;

function tsBlank(){
  return {id:null,name:'',description:'',cases:[],owner:'local',tags:[],
          enabled:true,revision:null,fingerprint:''};
}

async function renderSuites(){
  const view=routeVersion;
  tsEdit=null;tsFormSeq++;
  const app=$('app'); app.innerHTML='<h1>测试套件</h1><div class="card"><p class="muted">加载中…</p></div>';
  try{
    const suites=await j('/api/suites');
    if(view!==routeVersion)return;
    tsList=suites;
    tsRender();
  }catch(e){if(view===routeVersion)app.innerHTML=`<div class="card err">加载失败：${esc(e.message)}</div>`;}
}

function tsCaseRows(){
  const cs=tsEdit.cases||[];
  if(!cs.length) return '<tr><td colspan="7" class="muted">暂无用例 —— 从右上方选择后点「添加到末尾」</td></tr>';
  return cs.map((c,i)=>{
    const tc=plFindCase(c.id);
    const stale=!!tc&&(Number(tc.revision)!==Number(c.revision)
                       ||String(tc.fingerprint)!==String(c.fingerprint));
    const state=!tc
      ? '<span class="chip c-failed" title="用例不存在或已停用">不可用</span>'
      : stale
        ? '<span class="chip c-timedout" title="用例已被修改，保存 / 展开时后端会如实报错">已过期</span>'
        : '<span class="chip c-success">有效</span>';
    return `<tr><td>${i+1}</td>
      <td>${esc(tc?tc.name:('用例 #'+c.id))}</td>
      <td>${esc(tc?tc.engine:'-')}</td>
      <td>rev ${esc(c.revision)}</td>
      <td><code>${esc(c.fingerprint||'-')}</code></td>
      <td>${state}</td>
      <td class="row">
        <a href="javascript:void 0" onclick="tsMoveCase(${i},-1)">↑</a>
        <a href="javascript:void 0" onclick="tsMoveCase(${i},1)">↓</a>
        <a href="javascript:void 0" onclick="tsDelCase(${i})">删除</a>
      </td></tr>`;
  }).join('');
}

function tsCaseOpts(){
  const used=new Set((tsEdit.cases||[]).map(c=>Number(c.id)));
  const list=(plRefs.cases||[]).filter(c=>!used.has(Number(c.id)));
  if(!list.length) return '<option value="">（没有可添加的已启用用例）</option>';
  return '<option value="">（选择用例）</option>'+list.map(c=>
    `<option value="${c.id}">${esc(c.name)} · ${esc(c.engine)} · rev${c.revision}</option>`).join('');
}

function tsRender(){
  const app=$('app'); const e=tsEdit||tsBlank();
  const rows=tsList.map(s=>`<tr>
      <td>${s.id}</td>
      <td>${esc(s.name)}${s.id===e.id?' <span class="chip">编辑中</span>':''}</td>
      <td>${esc(s.description||'')}</td>
      <td>${(s.cases||[]).length}</td>
      <td>rev ${s.revision}</td>
      <td><code>${esc(s.fingerprint)}</code></td>
      <td>${s.enabled?'<span class="chip c-success">启用</span>':'<span class="chip c-skipped">停用</span>'}</td>
      <td class="row">
        <a href="javascript:void 0" onclick="tsLoad(${s.id})">查看 / 编辑</a>
        <a href="javascript:void 0" onclick="tsToggle(${s.id})">${s.enabled?'停用':'启用'}</a>
        <a href="javascript:void 0" onclick="tsDelete(${s.id})">删除</a>
      </td></tr>`).join('')||'<tr><td colspan="8" class="muted">暂无套件</td></tr>';
  app.innerHTML=`<h1>测试套件 <span class="muted">定义层 · 有序用例集合</span></h1>
    <div class="card">
      <div class="row"><h2 style="margin:0">套件列表</h2>
        <button style="margin-left:auto" onclick="tsNew()">新建套件</button></div>
      <p class="muted" style="margin:6px 0 0">套件只描述「引用哪些用例、按什么顺序」。
        <b>运行环境、执行机、数据来源由计划决定</b>；套件<b>不参与执行链</b>（不产生 PlanRun / Job / 报告），
        只在计划编辑时被展开成普通用例步骤。修改 <b>名称或用例列表（含顺序）</b> 会让 revision +1 并重算定义指纹；
        改描述、标签、负责人、启停 <b>不会</b> 改版本。</p>
      <table style="margin-top:10px"><thead><tr><th>ID</th><th>名称</th><th>描述</th><th>用例数</th>
        <th>版本</th><th>定义指纹</th><th>状态</th><th>操作</th></tr></thead><tbody>${rows}</tbody></table>
    </div>
    ${!tsEdit?`<p id="ts-msg" role="status">${esc(tsMsg)}</p>`:`<div class="card" id="ts-form">
      <div class="row"><h2 style="margin:0">${e.id?('编辑套件 #'+e.id+' · rev '+(e.revision??1)):'新建套件'}</h2>
        <span class="muted" style="margin-left:auto">${e.id?('当前定义指纹 <code>'+esc(e.fingerprint||'-')+'</code>'):'保存后计算定义指纹'}</span></div>
      <div class="form-grid" style="margin-top:12px">
        <label>名称<input id="ts-name" value="${esc(e.name)}" placeholder="套件名称"></label>
        <label>描述<input id="ts-desc" value="${esc(e.description||'')}" placeholder="用途 / 范围说明"></label>
        <label>负责人<input id="ts-owner" value="${esc(e.owner||'local')}"></label>
        <label>标签（逗号分隔）<input id="ts-tags" value="${esc((e.tags||[]).join(','))}" placeholder="smoke,privahigh"></label>
      </div>
      <div class="row" style="margin-top:14px"><h3 style="margin:0">用例（按此顺序执行）</h3>
        <select id="ts-add-case" style="margin-left:auto">${tsCaseOpts()}</select>
        <button onclick="tsAddCase()">添加到末尾</button></div>
      <table style="margin-top:8px"><thead><tr><th>#</th><th>用例</th><th>引擎</th><th>pin 的版本</th>
        <th>pin 的定义指纹</th><th>状态</th><th>操作</th></tr></thead>
        <tbody>${tsCaseRows()}</tbody></table>
      <div class="row" style="margin-top:12px">
        <button class="primary" onclick="tsSave()">保存</button>
        <button onclick="tsCancel()">取消</button>
        <span class="muted" id="ts-msg">${esc(tsMsg||'')}</span>
      </div>
      <p class="muted" style="margin-top:8px">用例在这里以 <code>(id, revision, 指纹)</code> <b>固定引用</b>：
        用例一旦被修改，本套件会显示「已过期」，保存时后端如实报错，不会静默跟随。
        在<b>计划编辑器</b>里可以把本套件展开成等价的用例步骤（套件本身不会被写进计划）。</p>
    </div>`}`;
}

function tsCollect(){
  if(!tsEdit)return;
  const el=$('ts-name'); if(!el)return;
  tsEdit.name=el.value.trim();
  tsEdit.description=($('ts-desc')||{}).value||'';
  tsEdit.owner=($('ts-owner')||{}).value||'local';
  tsEdit.tags=(($('ts-tags')||{}).value||'').split(',').map(s=>s.trim()).filter(Boolean);
}
function tsNew(){return tsOpen(null);}
function tsCancel(){tsFormSeq++;tsEdit=null;tsMsg='';tsRender();}
function tsLoad(id){return tsOpen(id);}
async function tsOpen(id){
  const view=routeVersion,seq=++tsFormSeq;
  tsCollect();
  tsMsg='加载可选用例中…';tsRender();
  try{
    const cases=await j('/api/test-cases?enabled=1');
    if(view!==routeVersion||seq!==tsFormSeq)return;
    const s=id?tsList.find(x=>x.id===id):tsBlank();if(!s)return;
    plRefs.cases=cases;tsEdit=structuredClone(s);tsMsg='';tsRender();focusForm('ts-form');
  }catch(e){if(view===routeVersion&&seq===tsFormSeq){tsMsg='用例加载失败，请重新点击新建或编辑：'+e.message;tsRender();}}
}
function tsAddCase(){
  tsCollect();
  const sel=$('ts-add-case'); const cid=sel?Number(sel.value)||0:0;
  if(!cid){tsMsg='请先选择要添加的用例';tsRender();return;}
  const tc=(plRefs.cases||[]).find(c=>Number(c.id)===cid);
  if(!tc){tsMsg='用例不存在或已停用';tsRender();return;}
  if((tsEdit.cases||[]).some(c=>Number(c.id)===cid)){tsMsg='该用例已在套件中';tsRender();return;}
  tsEdit.cases=(tsEdit.cases||[]).concat([{id:tc.id,revision:tc.revision,fingerprint:tc.fingerprint}]);
  tsMsg=''; tsRender();
}
function tsDelCase(i){tsCollect();tsEdit.cases.splice(i,1);tsMsg='';tsRender();}
function tsMoveCase(i,dir){
  tsCollect();
  const a=tsEdit.cases, k=i+dir;
  if(k<0||k>=a.length)return;
  [a[i],a[k]]=[a[k],a[i]];
  tsMsg='（顺序已调整，保存后 revision +1）'; tsRender();
}
async function tsSave(){
  if(tsBusy)return; tsBusy=true;
  const msg=$('ts-msg'); if(msg)msg.textContent='保存中…';
  try{
    tsCollect();
    const body={name:tsEdit.name,description:tsEdit.description||'',cases:tsEdit.cases||[],
      owner:tsEdit.owner||'local',tags:tsEdit.tags||[],enabled:!!tsEdit.enabled};
    if(!body.name)throw new Error('名称必填');
    const saved= tsEdit.id
      ? await j('/api/suites/'+tsEdit.id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
      : await j('/api/suites',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    tsList=await j('/api/suites');
    tsEdit=null;
    tsMsg=`已保存 · rev ${saved.revision} · 指纹 ${saved.fingerprint}`;
    tsRender();
  }catch(e){if(msg)msg.textContent='保存失败：'+e.message;}
  finally{tsBusy=false;}
}
async function tsToggle(id){
  try{ await j(`/api/suites/${id}/toggle`,{method:'POST'});
       tsList=await j('/api/suites');
       if(tsEdit&&tsEdit.id===id){const f=tsList.find(x=>x.id===id); if(f)tsEdit=JSON.parse(JSON.stringify(f));}
       tsRender(); }
  catch(e){alert('操作失败：'+e.message);}
}
async function tsDelete(id){
  if(!confirm('确认删除套件 #'+id+'？（已被计划引用时会拒绝删除）'))return;
  try{ await j(`/api/suites/${id}`,{method:'DELETE'});
       if(tsEdit&&tsEdit.id===id)tsEdit=null;
       tsList=await j('/api/suites'); tsMsg='已删除 #'+id; tsRender(); }
  catch(e){alert('删除失败：'+e.message);}
}

// ---------- 报告中心（读模型：筛选 / 分页 / 统一字段 / 对比入口） ----------
let rcState={page:1,plan_id:'',engine:'',status:'',env_name:'',time_from:'',time_to:''};
async function renderReportCenter(){
  const app=$('app');
  app.innerHTML='<h1>报告中心</h1><div class="card"><p class="muted">加载中…</p></div>';

    const[data,opt,sel]=await Promise.all([
      j(`/api/report-center?${rcParams()}`),
      j('/api/report-center/options'),
      Promise.resolve(compareSel()),
    ]);
    const rows=data.rows||[];
    const incompl=rows.some(r=>r.metadata_incomplete);
    const items=rows.map(r=>rcRow(r,sel)).join('');
    app.innerHTML=`<h1>报告中心 <span class="muted">${data.total} 条</span></h1>
      <div class="card">
        <div class="filters">
          <b>筛选</b>
          <select id="f-plan" onchange="rcSet('plan_id',this.value)"><option value="">全部计划</option>${opt.plans.map(p=>`<option value="${p.id}" ${rcState.plan_id==p.id?'selected':''}>${esc(p.name)} (${p.n})</option>`).join('')}</select>
          <select id="f-engine" onchange="rcSet('engine',this.value)"><option value="">全部引擎</option>${opt.engines.map(e=>`<option value="${esc(e)}" ${rcState.engine==e?'selected':''}>${esc(e)}</option>`).join('')}</select>
          <select id="f-status" onchange="rcSet('status',this.value)"><option value="">全部状态</option>${opt.statuses.map(s=>`<option value="${esc(s)}" ${rcState.status==s?'selected':''}>${esc(s)}</option>`).join('')}</select>
          <select id="f-env" onchange="rcSet('env_name',this.value)"><option value="">全部环境</option>${opt.envs.map(e=>`<option value="${esc(e.name)}" ${rcState.env_name==e.name?'selected':''}>${esc(e.name)} (${e.n})</option>`).join('')}</select>
          <input id="f-from" type="text" placeholder="开始时间从 YYYY-MM-DD" value="${esc(rcState.time_from)}" onchange="rcSet('time_from',this.value)">
          <input id="f-to" type="text" placeholder="到 YYYY-MM-DD" value="${esc(rcState.time_to)}" onchange="rcSet('time_to',this.value)">
          <button onclick="rcClear()">重置</button>
        </div>
      </div>
      <div class="card">
        ${sel.b||sel.c?`<div class="row" style="margin-bottom:8px;gap:6px">
          <span class="muted">基线 ${sel.b?'#'+sel.b:'（未选）'} · 候选 ${sel.c?'#'+sel.c:'（未选）'}</span>
          ${sel.b&&sel.c?`<a class="primary" href="#/compare/${sel.b}/${sel.c}" style="display:inline-block;background:var(--brand);color:#fff;padding:4px 12px;border-radius:6px;text-decoration:none;font-size:13px">进入对比视图</a>`
            :`<span class="muted">两份都选齐后才能进入对比视图</span>`}
          <a href="javascript:void 0" onclick="pickClear()" class="muted" style="font-size:12px">清除选择</a>
        </div>`:`
        <p class="muted">在下方报告中，用“基线/候选”标记两份报告后生成对比。</p>`}
        <table><thead><tr><th>Job</th><th>状态</th><th>计划</th><th>引擎</th><th>环境</th><th>开始时间</th><th>耗时</th><th>关键摘要指标</th><th>操作</th></tr></thead>
        <tbody>${items||'<tr><td colspan=9 class="muted">暂无报告</td></tr>'}</tbody></table>
        <div class="pager">

          <button ${data.page*data.page_size>=data.total?'disabled':''} onclick="rcGo(${data.page+1})">下一页</button>
          <span class="muted">每页 ${data.page_size} 条</span>
        </div>
        ${incompl?'<p class="muted" style="margin-top:8px">注：标记 ⚠ 的报告缺少可比性元数据（历史记录信息不完整），不参与有效对比。</p>':''}
      </div>`;
  }catch(e){app.innerHTML=`<div class="card err">加载报告中心失败：${esc(e.message)}</div>`;}
}
function rcParams(){
  const q=new URLSearchParams();
  q.set('page',rcState.page); q.set('page_size',20);
  if(rcState.plan_id)q.set('plan_id',rcState.plan_id);
  if(rcState.engine)q.set('engine',rcState.engine);
  if(rcState.status)q.set('status',rcState.status);
  if(rcState.env_name)q.set('env_name',rcState.env_name);
  if(rcState.time_from)q.set('time_from',rcState.time_from);
  if(rcState.time_to)q.set('time_to',rcState.time_to);
  return q.toString();
}
function rcSet(k,v){rcState[k]=v;rcState.page=1;renderReportCenter();}
function rcGo(p){rcState.page=p;renderReportCenter();}
function rcClear(){rcState={page:1,plan_id:'',engine:'',status:'',env_name:'',time_from:'',time_to:''};renderReportCenter();}
function rcRow(r,sel){
  const m=r.metrics||{};
  const incompl=!!r.metadata_incomplete;
  const key=engineKeyMetric(r.engine,m);
  const isBase=sel.b==String(r.job_id), isCand=sel.c==String(r.job_id);
  const cls=(isBase?' sel-base':isCand?' sel-cand':'');
  return `<tr class="${cls.trim()}">
    <td><strong>#${r.job_id??'-'}</strong>${r.plan_run_id?`<div class="muted">run#${r.plan_run_id}</div>`:''}</td>
    <td>${chip(r.status)}${incompl?'<span title="历史记录信息不完整"> ⚠</span>':''}</td>
    <td>${esc(r.plan_name||('plan#'+r.plan_id))}</td>
    <td>${esc(r.engine)}${r.schema_main_version?`<div class="muted">${esc(r.schema_main_version)}</div>`:''}</td>
    <td>${esc(r.env_name||'-')}</td>
    <td class="muted">${esc(r.started_at||'-')}</td>
    <td>${fmtDur(r.duration_ms)}</td>
    <td>${esc(key)}</td>
    <td class="row">
      <a href="#/report/${r.job_id}">详情</a>
      ${r.plan_run_id?`<a href="#/run/${r.plan_run_id}">所属执行</a>`:''}
      <a href="javascript:void 0" onclick="pickBaseline(${r.job_id})">基线</a>
      <a href="javascript:void 0" onclick="pickCandidate(${r.job_id})">候选</a>
      <a href="javascript:void 0" onclick="showLogsRC(${r.job_id})">日志</a>
    </td>
  </tr>`;
}
async function showLogsRC(jobId){
  try{const data=await j(`/api/jobs/${jobId}/logs`);alert((data.logs||[]).join('').slice(-1500)||'（暂无日志）');}
  catch(e){alert('无日志：'+e.message);}
}
function engineKeyMetric(engine,m){
  if(engine==='locust')return `RPS ${fmt(m.rps)} · 错误率 ${pct(m.failure_rate)} · P95 ${fmt(m.p95_ms)}ms`;
  if(engine==='matcheval')return `P ${pct(m.precision)} · R ${pct(m.recall)} · F1 ${pct(m.f1)} · TP ${m.tp}`;
  return `通过 ${m.passed??'-'} / 失败 ${m.failed??'-'} · ${fmt(m.duration_ms)}ms`;
}
function fmt(v,d){return (v==null||isNaN(v))?(d??'-'):v;}
function pct(v){return (v==null||isNaN(v))?'-':(Number(v)*100).toFixed(1)+'%';}
function fmtDur(ms){if(ms==null||isNaN(ms))return '-';return ms>=1000?(ms/1000).toFixed(1)+'s':ms+'ms';}

// ---------- 两次运行对比视图（严格兼容校验） ----------
async function renderCompare(baseId,candId){
  const app=$('app'); app.innerHTML='<h1>对比视图</h1><div class="card"><p class="muted">加载中…</p></div>';
  try{
    const r=await j(`/api/report-center/compare`,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({baseline_job_id:Number(baseId),candidate_job_id:Number(candId)})});
    const reasons=(r.reasons||[]).map(x=>`<li>${esc(x)}</li>`).join('');
    const deltaRows=(r.deltas.items||[]).map(d=>`<tr>
      <td>${esc(d.label)}</td><td>${esc(d.base??'-')}</td><td>${esc(d.candidate??'-')}</td>
      <td class="${d.delta==null?'muted':`diff ${d.color}`}">${d.delta==null?'N/A':(d.formatted||d.delta)} ${d.dir_label?`<span class="muted">(${d.dir_label})</span>`:''}</td>
      <td class="muted">${d.direction==='higher_better'?'越高越好':d.direction==='lower_better'?'越低越好':'-'}</td>
    </tr>`).join('')||'<tr><td colspan=5 class=muted>（无可用指标）</td></tr>';
    app.innerHTML=`<h1>对比视图 <span class="muted">#${baseId} vs #${candId}</span></h1>
      <div class="card"><div class="row"><span class="muted">结论</span>
        <strong class="${r.compatible?'ok':'err'}">${esc(r.summary)}</strong>
        <a href="#/reports-center" class="muted" style="margin-left:auto">返回报告中心</a></div>
        ${reasons?`<ul style="margin-top:8px">${reasons}</ul>`:''}</div>
      <div class="card"><h2>基线 <span class="muted">#${r.baseline.job_id}</span></h2>
        ${sumIdx(r.baseline)}<p><a href="#/report/${r.baseline.job_id}">查看基线报告详情</a></p></div>
      <div class="card"><h2>候选 <span class="muted">#${r.candidate.job_id}</span></h2>
        ${sumIdx(r.candidate)}<p><a href="#/report/${r.candidate.job_id}">查看候选报告详情</a></p></div>
      ${r.compatible?`<div class="card"><h2>引擎专项指标对比 <span class="muted">${esc((r.deltas.engine||'')+'')}</span></h2>
        <table><thead><tr><th>指标</th><th>基线</th><th>候选</th><th>差值</th><th>方向</th></tr></thead><tbody>${deltaRows}</tbody></table>
        <p class="muted" style="margin-top:6px">配色：绿=更优，红=更差，灰=持平。未生成跨引擎总分。</p></div>`:''}
      ${trendBlock(r.trend)}
      <div class="card"><h2>原始 report.json</h2>
        <p><a href="#/report/${baseId}">基线</a> · <a href="#/report/${candId}">候选</a></p></div>`;
  }catch(e){app.innerHTML=`<div class="card err">对比失败：${esc(e.message)}</div>`;}
}
function sumIdx(x){
  return `<div class="metrics" style="margin-top:6px">
    <div><div class="k">计划</div><div class="v" style="font-size:15px">${esc(x.plan_name||'-')}</div></div>
    <div><div class="k">引擎</div><div class="v" style="font-size:15px">${esc(x.engine)}</div></div>
    <div><div class="k">状态</div><div class="v" style="font-size:15px">${chip(x.status)}</div></div>
    <div><div class="k">环境</div><div class="v" style="font-size:15px">${esc(x.env_name||'-')}</div></div>
    <div><div class="k">开始</div><div class="v" style="font-size:15px">${esc(x.started_at||'-')}</div></div>
    ${x.metadata_incomplete?`<div class="k" style="color:var(--fail)">⚠ 历史记录信息不完整，不参与有效对比</div>`:''}
  </div>`;
}
function trendBlock(trend){
  const pts=(trend.points||[]).map((p,i)=>`<tr>
    <td>${p.job_id}</td><td class="muted">${esc(p.started_at||'-')}</td>
    ${(trend.engine==='locust'?['rps','failure_rate','p95_ms']:trend.engine==='matcheval'?['precision','recall','f1']:['passed','failed']).map(k=>`<td>${fmtMetric(p.metrics[k],k)}</td>`).join('')}
  </tr>`).join('');
  if(!pts) return '';
  const cols = trend.engine==='locust'?'<th>RPS</th><th>错误率</th><th>P95 ms</th>'
    : trend.engine==='matcheval'?'<th>Precision</th><th>Recall</th><th>F1</th>'
    : '<th>通过</th><th>失败</th>';
  return `<div class="card"><h2>历史趋势 <span class="muted">同配置分组 · 共 ${trend.points.length} 次成功运行</span></h2>
    <table><thead><tr><th>Job</th><th>开始</th>${cols}</tr></thead><tbody>${pts}</tbody></table>
    <p class="muted" style="margin-top:6px">仅聚合同一可比性分组的成功报告；未生成跨引擎总分。</p></div>`;
}
function fmtMetric(v,k){
  if(v==null||isNaN(v)) return '-';
  if(k==='failure_rate'||k==='precision'||k==='recall'||k==='f1') return pct(v);
  return v;
}
