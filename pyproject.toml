[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# CLI isolation flags must be applied before importing the scheduler.
"backend/run.py" = ["E402"]

[tool.ruff.lint.isort]
combine-as-imports = true
